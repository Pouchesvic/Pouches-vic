<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Scan Inventory</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#efefec;color:#111;font-family:Arial,Helvetica,sans-serif}.wrap{max-width:680px;margin:auto;padding:14px}.card{background:#fff;border-radius:18px;padding:15px;margin-bottom:12px}.title{font-size:28px;font-weight:1000}.muted{font-size:13px;color:#4f4f4f;line-height:1.45}.btn{border:0;border-radius:11px;background:#111;color:#fff;padding:13px 14px;font-weight:900;width:100%}.ghost{background:#e9e9e9;color:#111}.field{margin:10px 0}.field label{display:block;font-size:12px;font-weight:900;color:#333;margin-bottom:4px}.field input,.field select{width:100%;border:1px solid #c8c8c8;border-radius:10px;padding:12px;font-size:16px}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.hidden{display:none}.good{background:#e7f5e7;border-radius:12px;padding:11px}.warn{background:#fff1a8;border-radius:12px;padding:11px}.scanbox{background:#111;color:#fff;border-radius:16px;padding:15px}.video{width:100%;border-radius:14px;background:#222;max-height:330px;object-fit:cover;margin-top:10px}.big{font-size:24px;font-weight:1000}.hr{height:1px;background:#ddd;margin:12px 0}@media(max-width:460px){.two{grid-template-columns:1fr}}
</style></head><body><div class="wrap">
<div class="card"><div class="title">Scan Inventory</div><div class="muted">Phone camera, Bluetooth/USB scanner, or any scanner app that types the barcode into the box below.</div></div>
<div id="authMsg" class="card hidden"></div>
<div id="scanCard" class="scanbox"><b>BARCODE</b><div class="field"><input id="barcode" inputmode="numeric" autocomplete="off" placeholder="Scan or type barcode"></div><div class="two"><button class="btn" id="lookupBtn">LOOK UP</button><button class="btn ghost" id="cameraBtn">USE PHONE CAMERA</button></div><video id="video" class="video hidden" playsinline muted></video><div id="cameraMsg" class="muted" style="color:#ddd;margin-top:8px"></div></div>
<div id="result"></div>
<div class="card"><a class="btn ghost" style="display:block;text-align:center;text-decoration:none" href="/admin">BACK TO CONTROL ROOM</a></div>
</div>
<script>
const $=id=>document.getElementById(id),E=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const strengthLabel=value=>{const s=String(value??'').trim();if(!s)return '';if(/mg\s*$/i.test(s))return s.replace(/\s*mg\s*$/i,' mg');return /^\d+(?:\.\d+)?$/.test(s)?s+' mg':s};
let cfg=null,stream=null,detecting=false;const tid=new URLSearchParams(location.search).get('territory_id')||'';
async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})},cache:'no-store'});let j={};try{j=await r.json()}catch{}if(r.status===401){authMsg.classList.remove('hidden');authMsg.innerHTML='<div class="warn"><b>CONTROL ROOM SIGN-IN REQUIRED</b><div class="muted" style="margin-top:5px">Go back to the Control Room, sign in, then open Scan Inventory again.</div></div>';}if(!r.ok)throw Error(j.error||'Request failed');return j}
async function load(){try{cfg=await api('/api/admin/platform/config')}catch{} barcode.focus()}
async function lookup(){const code=barcode.value.trim();if(!code)return;try{const j=await api('/api/admin/platform/barcode/lookup/'+encodeURIComponent(code)+'?territory_id='+encodeURIComponent(tid));if(j.found)renderFound(j.product);else await renderUnknown(code)}catch(e){alert(e.message)}}
function renderFound(p){const plural=cfg?.profile?.item_plural||'items',variant=p.variant||p.strength;result.innerHTML=`<div class="card"><div class="good"><b>PRODUCT FOUND</b></div><div class="big" style="margin-top:10px">${E(p.generic_name||p.flavor||'Product')}</div><div class="muted">${E(p.category||p.brand||'')}${variant?' • '+E(strengthLabel(variant)):''}<br>Barcode: ${E(p.barcode)}${p.sku?'<br>SKU: '+E(p.sku):''}</div><div class="hr"></div><div class="big">${Number(p.inventory)||0}</div><div class="muted">currently in stock</div><div class="field"><label>HOW MANY ${E(plural.toUpperCase())} ARRIVED?</label><input id="qty" type="number" min="1" inputmode="numeric" value="1"></div><button class="btn" onclick="receive('${E(p.barcode)}')">RECEIVE STOCK</button></div>`}
async function renderUnknown(code){let products=[];try{products=await api('/api/admin/platform/products')}catch{}const p=cfg?.profile||{};result.innerHTML=`<div class="card"><div class="warn"><b>NEW BARCODE</b><div class="muted" style="margin-top:5px">This barcode has not been registered yet. Link it to an existing product, or create the product once. Future scans will be instant.</div></div><div class="field"><label>LINK TO EXISTING PRODUCT</label><select id="existing"><option value="">Choose product</option>${products.map(x=>`<option value="${E(x.id)}">${E(x.generic_name||x.flavor)}${x.category||x.brand?' • '+E(x.category||x.brand):''}</option>`).join('')}</select></div><button class="btn ghost" onclick="linkExisting('${E(code)}')">LINK BARCODE</button><div class="hr"></div><b>OR CREATE FROM THIS BARCODE</b><div class="field"><label>${E(p.product_name_label||'PRODUCT')}</label><input id="newName"></div><div class="two"><div class="field"><label>${E(p.product_group_label||'CATEGORY')}</label><input id="newCategory"></div><div class="field"><label>${E(p.variant_label||'VARIANT')}</label><input id="newVariant"></div></div><div class="two"><div class="field"><label>SKU (OPTIONAL)</label><input id="newSku"></div><div class="field"><label>STARTING STOCK</label><input id="newStock" type="number" min="0" inputmode="numeric" value="0"></div></div><label style="display:flex;gap:8px;align-items:center;margin:10px 0"><input id="newLive" type="checkbox" style="width:20px;height:20px"> List live now</label><button class="btn" onclick="createNew('${E(code)}')">CREATE PRODUCT</button></div>`}
async function receive(code){try{const q=Math.max(1,Math.trunc(+qty.value||1));const j=await api('/api/admin/platform/barcode/receive',{method:'POST',body:JSON.stringify({barcode:code,territory_id:tid,qty:q})});renderFound(j.product);barcode.value='';barcode.focus();alert(`Stock updated to ${j.balance}.`)}catch(e){alert(e.message)}}
async function linkExisting(code){if(!existing.value)return alert('Choose a product.');try{await api('/api/admin/platform/barcode/assign',{method:'POST',body:JSON.stringify({product_id:existing.value,barcode:code})});barcode.value=code;await lookup()}catch(e){alert(e.message)}}
async function createNew(code){if(!newName.value.trim())return alert('Enter the product name.');try{await api('/api/admin/platform/barcode/create',{method:'POST',body:JSON.stringify({barcode:code,territory_id:tid,name:newName.value,category:newCategory.value,variant:newVariant.value,sku:newSku.value,starting_stock:+newStock.value||0,listed:newLive.checked})});barcode.value=code;await lookup()}catch(e){alert(e.message)}}
async function toggleCamera(){if(stream){stopCamera();return}if(!('BarcodeDetector'in window)){cameraMsg.textContent='This browser does not provide built-in barcode detection. You can still use a Bluetooth/USB scanner or a scanner app that types into the barcode box.';return}try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}});video.srcObject=stream;video.classList.remove('hidden');await video.play();cameraBtn.textContent='STOP CAMERA';cameraMsg.textContent='Point the rear camera at a barcode.';detecting=true;detectLoop()}catch(e){cameraMsg.textContent='Camera could not start: '+e.message}}
async function detectLoop(){let detector;try{detector=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128','code_39','itf','qr_code','data_matrix']})}catch{detector=new BarcodeDetector()}while(detecting&&stream){try{const codes=await detector.detect(video);if(codes?.[0]?.rawValue){barcode.value=codes[0].rawValue;stopCamera();await lookup();return}}catch{}await new Promise(r=>setTimeout(r,180))}}
function stopCamera(){detecting=false;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}video.classList.add('hidden');video.srcObject=null;cameraBtn.textContent='USE PHONE CAMERA';cameraMsg.textContent=''}
lookupBtn.onclick=lookup;cameraBtn.onclick=toggleCamera;barcode.addEventListener('keydown',e=>{if(e.key==='Enter')lookup()});window.addEventListener('beforeunload',stopCamera);load();
</script></body></html>
