<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pouches Vic</title>
<style>
*{box-sizing:border-box}
:root{--bg:#f2f2ef;--ink:#111;--muted:#4f4f4f;--line:#dededb;--card:#fff}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
button,input,select,textarea{font:inherit}
button{touch-action:manipulation}
.wrap{max-width:680px;margin:auto;padding:16px}
.top{background:#111;color:#fff;text-align:center;padding:9px;font-size:12px;font-weight:900;letter-spacing:.2px}
.card{background:var(--card);border-radius:22px;padding:20px;margin-bottom:14px}
.head{display:flex;align-items:center;justify-content:space-between;gap:14px}
.logo{font-size:25px;font-weight:1000}
.muted{color:var(--muted)}
.hero{text-align:center;padding:36px 22px}
.hero h1{font-size:32px;line-height:1.02;margin:8px 0}
.hero p{line-height:1.5}
.serviceInfo{background:#111;color:#fff;border-radius:18px;padding:17px 18px;margin:12px 0 16px;text-align:center}
.serviceInfo .hoursLabel{font-size:11px;font-weight:900;letter-spacing:.12em;opacity:.82}
.serviceInfo .hoursValue{font-size:20px;font-weight:1000;margin:4px 0 13px}
.serviceInfo .sameDay{font-size:18px;font-weight:1000;letter-spacing:.04em}
.serviceInfo .payNote{font-size:13px;opacity:.88;margin-top:5px}
.btn{width:100%;border:0;border-radius:12px;background:#111;color:#fff;padding:15px;font-weight:900;cursor:pointer}
.btn:disabled{opacity:.45;cursor:not-allowed}
.territory{font-size:13px;font-weight:900;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;min-width:138px}
.section{font-size:27px;text-align:center;margin:28px 0 12px}
.shop-anchor{height:1px;scroll-margin-top:12px}
.brands{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin-bottom:14px}
.brand{border:1px solid var(--line);background:#fff;padding:9px 12px;border-radius:10px;font-weight:850}
.brand.active{background:#111;color:#fff;border-color:#111}
.inventory{display:flex;flex-direction:column;gap:10px}
.product-row{background:#fff;border-radius:18px;padding:12px;display:grid;grid-template-columns:82px 1fr;gap:12px;align-items:center}
.thumb{width:82px;height:82px;background:#f3f3f1;border-radius:14px;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#aaa;font-size:10px;font-weight:900;text-align:center}
.thumb img{width:100%;height:100%;object-fit:contain;padding:4px}
.pname{font-size:17px;font-weight:1000;text-transform:uppercase;line-height:1.05}
.pmeta{font-size:13px;color:var(--muted);margin-top:4px}
.price-stock{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:9px}
.price{font-size:17px;font-weight:1000}

.qty-wrap{display:flex;align-items:center;justify-content:flex-end;gap:7px;margin-top:10px}
.qty-label{font-size:11px;font-weight:900;color:#4f4f4f;margin-right:auto}
.stepper{display:grid;grid-template-columns:42px 58px 42px;align-items:center;border:1px solid #d6d6d3;border-radius:12px;overflow:hidden;background:#f8f8f6}
.stepper button{height:42px;border:0;background:#111;color:#fff;font-size:24px;line-height:1;font-weight:700}
.stepper button:disabled{background:#d7d7d4;color:#888}
.stepper input{width:58px;height:42px;border:0;border-left:1px solid #ddd;border-right:1px solid #ddd;text-align:center;font-size:17px;font-weight:900;background:#fff;outline:none;-moz-appearance:textfield}
.stepper input::-webkit-inner-spin-button,.stepper input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.empty{background:#fff;border-radius:18px;padding:28px;text-align:center}
.cartbar{position:sticky;bottom:10px;display:none;background:#111;color:#fff;border-radius:15px;padding:12px 14px;margin-top:18px;box-shadow:0 8px 25px #0003;z-index:5}
.cartbar.show{display:flex;justify-content:space-between;align-items:center;gap:10px}
.cartbar button{border:0;background:#fff;border-radius:10px;font-weight:900;padding:10px 12px;white-space:nowrap}
.cart-small{font-size:12px;color:#eee;margin-top:2px}
.sheet{display:none;position:fixed;inset:0;background:#0008;z-index:30;align-items:flex-end}
.sheet.open{display:flex}
.sheetbox{background:#fff;width:100%;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
.close{float:right;border:0;background:#eee;border-radius:10px;padding:8px 11px;font-size:18px}
.checkout-title{margin:2px 0 14px}
.checkout-items{border:1px solid #e4e4e1;border-radius:15px;padding:4px 12px;margin-bottom:12px}
.checkout-item{display:grid;grid-template-columns:1fr;gap:10px;padding:13px 0;border-bottom:1px solid #ddd}
.checkout-item:last-child{border-bottom:0}
.checkout-product{display:grid;gap:4px}.checkout-product-name{font-size:17px;font-weight:900}.checkout-product-meta{font-size:13px;color:#3f3f3f;line-height:1.4}.checkout-product-total{display:flex;justify-content:space-between;gap:12px;font-size:14px;margin-top:3px}.checkout-item .stepper{justify-self:start}
.checkout-item .stepper{grid-template-columns:36px 46px 36px}
.checkout-item .stepper button,.checkout-item .stepper input{height:36px}
.checkout-item .stepper input{width:46px;font-size:15px}
.small{font-size:13px;color:#4f4f4f}
.notice{background:#f6f6f4;border-radius:12px;padding:12px;font-size:13px;line-height:1.45;margin:10px 0}
.field-error{color:#9d1c1c;font-size:13px;font-weight:800;margin-top:5px}
.invalid{border-color:#b52121!important;box-shadow:0 0 0 2px #b5212120}
.field{margin:11px 0}
.field label{display:block;font-size:12px;font-weight:900;margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;border:1px solid #d7d7d4;border-radius:12px;padding:12px;font-size:16px;background:#fff;color:#111}
.field textarea{min-height:92px;resize:vertical}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-grid .field{margin:0}
.checkrow{display:flex;gap:10px;align-items:flex-start;background:#f6f6f4;border-radius:12px;padding:12px;margin:12px 0}
.checkrow input{width:21px;height:21px;margin:0;flex:0 0 auto}
.checkrow label{font-size:13px;line-height:1.35}
.summary{background:#111;color:#fff;border-radius:14px;padding:14px;margin:14px 0}
.summary-line{display:flex;justify-content:space-between;gap:12px;margin:5px 0}
.summary-line.total{font-size:18px;font-weight:900;border-top:1px solid #ffffff33;padding-top:9px;margin-top:9px}
.summary-saving{color:#b8f1c7;font-size:13px;font-weight:900;margin-top:10px}
details.notice summary{font-weight:900;cursor:pointer}
.success{text-align:center;padding:28px 10px}
.success h2{font-size:28px;margin-bottom:8px}
.confirm-check{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:#111;color:#fff;font-size:30px;font-weight:900;margin:0 auto 14px}
.confirm-title{font-size:27px;font-weight:1000;margin-bottom:5px}
.receipt{background:#f6f6f4;border-radius:14px;padding:13px;margin:18px 0;text-align:left}
.receipt-line{display:flex;justify-content:space-between;gap:14px;padding:7px 0;line-height:1.35}
.receipt-line span:first-child{min-width:0}
.receipt-line b,.receipt-line span:last-child{white-space:nowrap}
.receipt-line.total{border-top:1px solid #cfcfcb;margin-top:6px;padding-top:12px;font-size:19px;font-weight:1000}
.hr{height:1px;background:#ddd;margin:8px 0}
.order-meta{text-align:left;line-height:1.45}
.order-page{max-width:680px;margin:auto;padding:16px}
.status-chip{display:inline-block;background:#fff1a8;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:900}
.ghost{background:#e9e9e9;color:#111}
.footer{text-align:center;color:#4f4f4f;font-size:13px;padding:20px 0 30px}
@media(max-width:460px){.form-grid{grid-template-columns:1fr}.logo{font-size:22px}.territory{min-width:125px}.product-row{grid-template-columns:74px 1fr}.thumb{width:74px;height:74px}}
</style>
</head>
<body>
<div class="top">LOCAL POUCH SERVICE</div>
<div class="wrap">
  <div class="card head"><div class="logo">POUCHES VIC</div><select id="territorySelect" class="territory"></select></div>
  <div class="card hero"><div class="small"><b>LOCAL • SIMPLE • FAST</b></div><h1>YOUR POUCHES.<br>RIGHT HERE.</h1><button class="btn" id="shopBtn">SHOP POUCHES</button></div>
  <div id="laneBanner"></div>
  <div class="serviceInfo">
    <div class="hoursLabel">HOURS</div>
    <div id="hoursValue" class="hoursValue">Hours posted here</div>
    <div id="sameDayText" class="sameDay">SAME-DAY DELIVERY</div>
    <div id="paymentNoteText" class="payNote">No upfront payment — pay when your order arrives.</div>
  </div>
  <div id="shop" class="shop-anchor"></div>
  <div id="brands" class="brands"></div>
  <div id="products" class="inventory"><div class="empty">Loading…</div></div>
  <div id="cartbar" class="cartbar"><div><b id="cartcount">0 cans</b><div class="cart-small" id="carttier"></div></div><button id="reviewBtn">REVIEW ORDER</button></div>
  <div class="footer">© 2026 Pouches Vic</div>
</div>
<div id="sheet" class="sheet"><div class="sheetbox">
  <button class="close" id="closeBtn">✕</button>
  <div id="checkout"></div>
</div></div>
<script>
let territories=[],data=null,cart={},currentSlug='victoria',activeBrand='',storefrontLane=new URLSearchParams(location.search).get('lane')==='small'?'small':'main',cartTransferChecked=false;
Object.defineProperties(window,{data:{configurable:true,get:()=>data},currentSlug:{configurable:true,get:()=>currentSlug},activeBrand:{configurable:true,get:()=>activeBrand}});
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const centsMoney=c=>new Intl.NumberFormat('en-CA',{style:'currency',currency:'CAD'}).format((Number(c)||0)/100);
const toCents=v=>Math.round((Number(v)||0)*100);
function displayStrength(value){const s=String(value??'').trim();if(!s)return '';if(/mg\s*$/i.test(s))return s.replace(/\s*mg\s*$/i,' mg');return /^\d+(?:\.\d+)?$/.test(s)?s+' mg':s;}
function tierCents(t){return Number(t?.unit_price_cents ?? toCents(t?.unit_price));}
function zoneFeeCents(z){return Number(z?.fee_cents ?? toCents(z?.fee));}
function overrideCents(p){if(p?.local_price_override_cents!=null)return Number(p.local_price_override_cents);if(p?.local_price_override!=null)return toCents(p.local_price_override);return null;}
function tier(q){return data?.tiers?.find(x=>q>=Number(x.min_qty)&&(x.max_qty==null||q<=Number(x.max_qty)))||data?.tiers?.at(-1)||null;}
function unitPriceCents(q,p){const o=overrideCents(p);return o!=null?o:tierCents(tier(q));}
function productById(pid){return data?.products?.find(x=>x.id===pid);}
function cartQty(){return Object.values(cart).reduce((a,b)=>a+Number(b||0),0);}
function cartSubtotalCents(){const q=cartQty();return Object.entries(cart).reduce((sum,[pid,n])=>{const p=productById(pid);return p?sum+unitPriceCents(q,p)*Number(n||0):sum;},0);}
function clampQty(pid,value){const p=productById(pid);if(!p)return 0;return Math.max(0,Math.min(Number(p.inventory)||0,Math.trunc(Number(value)||0)));}
async function init(){
  const om=location.pathname.match(/^\/order\/([^/]+)$/);if(om)return renderOrderPage(decodeURIComponent(om[1]));
  territories=await fetch('/api/public/territories',{cache:'no-store'}).then(r=>r.json());
  const hostMatch=territories.find(t=>t.domain&&String(t.domain).toLowerCase()===location.hostname.toLowerCase());
  currentSlug=(new URLSearchParams(location.search).get('territory')||hostMatch?.slug||'victoria');
  if(!territories.some(t=>t.slug===currentSlug))currentSlug=territories[0]?.slug||'victoria';
  const areaLabel=t=>t.slug==='victoria'?'Greater Victoria / Langford / Sidney':t.slug==='sooke'?'Sooke / North Langford':t.name;
  $('territorySelect').innerHTML=territories.map(t=>`<option value="${esc(t.slug)}" ${t.slug===currentSlug?'selected':''}>${esc(areaLabel(t))}</option>`).join('');
  $('territorySelect').onchange=()=>{currentSlug=$('territorySelect').value;if(currentSlug!=='victoria')storefrontLane='main';cart={};activeBrand='';load();};
  $('shopBtn').onclick=()=>$('shop').scrollIntoView({behavior:'smooth'});
  $('reviewBtn').onclick=reviewOrder;
  $('closeBtn').onclick=closeCart;
  $('sheet').onclick=e=>{if(e.target===$('sheet'))closeCart();};
  await load();
}
async function load(){
  if(currentSlug!=='victoria')storefrontLane='main';
  data=await fetch('/api/public/territory/'+encodeURIComponent(currentSlug)+'?lane='+encodeURIComponent(storefrontLane),{cache:'no-store'}).then(r=>r.json());
  $('hoursValue').textContent=data.territory?.operating_hours||'Hours not posted';
  $('sameDayText').textContent=data.territory?.same_day_text||'SAME-DAY DELIVERY';
  $('paymentNoteText').textContent=data.territory?.payment_note_text||'No upfront payment — pay when your order arrives.';
  let changed=false;for(const pid of Object.keys(cart)){const before=Number(cart[pid])||0,p=productById(pid);if(!p){delete cart[pid];changed=true}else{cart[pid]=clampQty(pid,cart[pid]);if(cart[pid]!==before)changed=true;if(!cart[pid])delete cart[pid];}}
  if(!cartTransferChecked){cartTransferChecked=true;try{const saved=JSON.parse(sessionStorage.getItem('pv_cart_transfer')||'null');if(saved&&saved.slug===currentSlug&&saved.lane===storefrontLane){cart=saved.cart||{};sessionStorage.removeItem('pv_cart_transfer');for(const pid of Object.keys(cart)){const before=Number(cart[pid])||0,p=productById(pid);if(!p){delete cart[pid];changed=true}else{cart[pid]=clampQty(pid,cart[pid]);if(cart[pid]!==before)changed=true;if(!cart[pid])delete cart[pid];}}}}catch{sessionStorage.removeItem('pv_cart_transfer')}}
  renderLaneBanner();renderBrands();renderProducts();updateCart();if(changed)setTimeout(()=>alert('Your cart was updated to match the cans this driver has available.'),50);
}
function renderLaneBanner(){
  const box=$('laneBanner');if(!box)return;if(currentSlug!=='victoria'){box.innerHTML='';return;}
  box.innerHTML=storefrontLane==='small'
    ? `<div class="card" style="border:2px solid #111;text-align:center"><b style="font-size:20px">SMALL ORDERS • 1–4 CANS</b><div class="small" style="margin:6px 0 12px">Stock shown here is with the Small Orders driver.</div><button class="btn ghost" onclick="switchLane('main')">5+ CANS? MAIN SHOP</button></div>`
    : `<div class="card" style="border:2px solid #111;text-align:center"><b style="font-size:20px">LESS THAN 5 CANS?</b><div class="small" style="margin:6px 0 12px">Use Small Orders for 1–4 cans.</div><button class="btn" onclick="switchLane('small')">OPEN SMALL ORDERS</button></div>`;
}
function switchLane(lane){
  if(currentSlug!=='victoria')return;sessionStorage.setItem('pv_cart_transfer',JSON.stringify({slug:currentSlug,lane,cart}));const u=new URL(location.href);if(lane==='small')u.searchParams.set('lane','small');else u.searchParams.delete('lane');u.searchParams.set('territory','victoria');location.href=u.pathname+u.search;
}
function reviewOrder(){const q=cartQty();if(!q)return;if(currentSlug==='victoria'&&storefrontLane==='main'&&q<5){if(confirm('1–4 can orders use Small Orders. Move this cart there now?'))switchLane('small');return}if(currentSlug==='victoria'&&storefrontLane==='small'&&q>=5){if(confirm('5+ can orders use the Main Shop. Move this cart there now?'))switchLane('main');return}openCart();}
function renderBrands(){
  const bs=[...new Set((data.products||[]).map(p=>p.brand).filter(Boolean))];
  if(activeBrand&&!bs.includes(activeBrand))activeBrand='';
  if(bs.length<=1){
    activeBrand='';
    $('brands').innerHTML='';
    $('brands').style.display='none';
    return;
  }
  $('brands').style.display='flex';
  $('brands').innerHTML=`<button class="brand ${activeBrand===''?'active':''}" data-brand="">ALL</button>`+bs.map(b=>`<button class="brand ${activeBrand===b?'active':''}" data-brand="${esc(b)}">${esc(b)}</button>`).join('');
  $('brands').onclick=e=>{const btn=e.target.closest('[data-brand]');if(!btn)return;activeBrand=btn.dataset.brand||'';renderBrands();renderProducts();};
}
function renderProducts(){
  const list=(data.products||[]).filter(p=>!activeBrand||p.brand===activeBrand);
  $('products').innerHTML=list.length?list.map(p=>{
    const q=clampQty(p.id,cart[p.id]||0), max=Number(p.inventory)||0, base=unitPriceCents(Math.max(1,cartQty()||1),p);
    return `<div class="product-row">
      <div class="thumb">${p.image?`<img src="${esc(p.image)}" alt="${esc(p.brand+' '+p.flavor)}" onerror="this.onerror=null;this.src='/product-images/catalog-placeholder.webp'">`:'PRODUCT PHOTO'}</div>
      <div>
        <div class="pname">${esc(p.flavor)}</div>
        <div class="pmeta">${esc(p.brand)}${p.strength?' • '+esc(displayStrength(p.strength)):''}</div>
        <div class="price-stock"><span class="price">${centsMoney(base)}</span></div>
        <div class="qty-wrap"><span class="qty-label">QUANTITY</span>${stepperHtml(p.id,q,max)}</div>
      </div>
    </div>`;
  }).join(''):`<div class="empty">No products listed right now.</div>`;
}
function stepperHtml(pid,q,max){return `<div class="stepper"><button type="button" aria-label="Decrease quantity" ${q<=0?'disabled':''} onclick="changeQty('${pid}',-1)">−</button><input inputmode="numeric" type="number" min="0" max="${max}" value="${q}" aria-label="Quantity, maximum ${max}" onchange="setQty('${pid}',this.value)"><button type="button" aria-label="Increase quantity" ${q>=max?'disabled':''} onclick="changeQty('${pid}',1)">+</button></div>`;}
function setQty(pid,value){const q=clampQty(pid,value);if(q>0)cart[pid]=q;else delete cart[pid];renderProducts();updateCart();renderCheckoutItems();}
function changeQty(pid,delta){setQty(pid,(cart[pid]||0)+delta);}
function updateCart(){
  const q=cartQty();$('cartbar').classList.toggle('show',q>0);$('cartcount').textContent=q+' can'+(q===1?'':'s');
  $('carttier').textContent=q?`${centsMoney(tierCents(tier(q)))} bulk tier • ${centsMoney(cartSubtotalCents())} items`:'';
}
function paymentOptions(){
  const out=[];if(data.settings?.payment_cash_enabled)out.push('<option value="cash">Cash on delivery</option>');if(data.settings?.payment_etransfer_enabled)out.push('<option value="etransfer">e-Transfer on delivery</option>');return out.join('');
}
function paymentLabel(method){if(method==='cash')return 'Cash on delivery';if(method==='etransfer')return 'e-Transfer on delivery';if(method==='other')return 'Other';return method||'Not specified';}
function humanDate(value){if(!value)return '';return new Intl.DateTimeFormat('en-CA',{weekday:'long',month:'long',day:'numeric',timeZone:'UTC'}).format(new Date(value+'T12:00:00Z'));}
function validEmail(value){return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(value||'').trim());}
async function openCart(){
  if(!cartQty())return;
  $('checkout').innerHTML=`<h2 class="checkout-title">Review Order</h2><div id="checkoutItems" class="checkout-items"></div><div class="notice"><b>PRICE PER CAN</b><br>${(data.tiers||[]).map(x=>`${x.min_qty}${x.max_qty?'–'+x.max_qty:'+'} cans: ${centsMoney(tierCents(x))} each`).join('<br>')}</div>
    <input id="zone" type="hidden" value="">
    <div class="form-grid"><div class="field"><label>NAME</label><input id="customerName" autocomplete="name"></div><div class="field"><label>PHONE</label><input id="customerPhone" inputmode="tel" autocomplete="tel"></div></div>
    <div class="field"><label>EMAIL <span class="small">(optional — for confirmation and receipt)</span></label><input id="customerEmail" type="email" inputmode="email" autocomplete="email" aria-describedby="emailError"><div id="emailError" class="field-error" role="alert"></div></div>
    <div class="field"><label>DELIVERY ADDRESS</label><input id="customerAddress" autocomplete="street-address" placeholder="Start typing your street address"></div>
    <label class="checkrow"><input id="manualLocation" type="checkbox" onchange="toggleManualLocation()"><span>I can't enter my exact address</span></label>
    <div id="meetingWrap" class="field" hidden><label>TELL US WHERE TO MEET YOU</label><textarea id="meetingInstructions" placeholder="Construction site at Douglas & Bay. Use the side gate beside the gas station."></textarea></div>
    <div class="two"><div class="field"><label>DELIVERY DATE</label><input id="deliveryDate" type="date" onchange="loadScheduleWindows()"></div><div class="field" id="windowWrap"><label>45-MINUTE WINDOW</label><select id="deliveryWindow"><option value="">Loading times…</option></select></div></div>
    <label class="checkrow"><input id="outsideHours" type="checkbox" onchange="toggleOutsideHours()"><span>I need delivery outside normal hours</span></label>
    <div id="outsideWrap" class="field" hidden><label>TELL US WHEN YOU NEED DELIVERY</label><textarea id="outsideMessage" placeholder="Tell us the day and time that would work"></textarea></div>
    <div class="field"><label>DELIVERY NOTES <span class="small">(optional)</span></label><textarea id="deliveryNotes"></textarea></div>
    <div class="field"><label>PAYMENT</label><select id="paymentMethod">${paymentOptions()}</select></div><div class="field"><label>PAYMENT NOTE <span class="small">(optional)</span></label><input id="paymentNote"></div>
    <label class="checkrow"><input id="ageAck" type="checkbox"><span>${esc(data.settings?.age_acknowledgement_text||'I confirm that I meet the legal age requirement for this purchase.')}</span></label>
    <div id="orderSummary" class="summary"></div><button id="submitBtn" class="btn" onclick="submitOrder()">PLACE ORDER</button>`;
  $('zone').onchange=renderOrderSummary;$('customerEmail').addEventListener('blur',validateEmailField);$('customerAddress').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();e.stopPropagation();}});renderCheckoutItems();renderOrderSummary();$('sheet').classList.add('open');await loadScheduleWindows();
}
async function loadScheduleWindows(){const date=$('deliveryDate')?.value||'';try{const r=await fetch('/api/public/schedule?territory_slug='+encodeURIComponent(currentSlug)+(date?'&date='+encodeURIComponent(date):''),{cache:'no-store'}),s=await r.json();if(!r.ok)throw Error(s.error||'Could not load delivery times');$('deliveryDate').min=s.local_today;if(!$('deliveryDate').value)$('deliveryDate').value=s.date;const select=$('deliveryWindow');select.innerHTML=s.windows.length?'<option value="">Choose a time</option>'+s.windows.map(w=>`<option value="${esc(w.start+'|'+w.end+'|'+w.label)}">${esc(w.label)}</option>`).join(''):'<option value="">No regular times available</option>';if(s.setup_needed&&!s.windows.length)$('outsideHours').checked=true;toggleOutsideHours();}catch(e){$('deliveryWindow').innerHTML='<option value="">Times unavailable</option>';alert(e.message);}}
function toggleOutsideHours(){const on=$('outsideHours')?.checked;$('outsideWrap').hidden=!on;$('windowWrap').hidden=!!on;}
function toggleManualLocation(){const on=$('manualLocation')?.checked;$('meetingWrap').hidden=!on;$('customerAddress').disabled=!!on;if(on){$('zone').value='';renderOrderSummary();}}
function validateEmailField(){const input=$('customerEmail'),error=$('emailError');if(!input||!error)return true;const value=input.value.trim(),ok=!value||validEmail(value);input.classList.toggle('invalid',!ok);error.textContent=ok?'':'Enter a valid email address or leave this field blank.';return ok;}
function renderCheckoutItems(){const box=$('checkoutItems');if(!box)return;const entries=Object.entries(cart).filter(([,q])=>q>0),orderQty=cartQty();if(!entries.length){closeCart();return;}box.innerHTML=entries.map(([pid,q])=>{const p=productById(pid);if(!p)return '';const line=unitPriceCents(orderQty,p)*q;return `<div class="checkout-item"><div class="checkout-product"><div class="checkout-product-name">${esc(p.flavor)}</div><div class="checkout-product-meta"><b>Brand:</b> ${esc(p.brand)}<br><b>Strength:</b> ${esc(displayStrength(p.strength)||'Not specified')}<br><b>Quantity:</b> ${q}</div><div class="checkout-product-total"><span>${centsMoney(unitPriceCents(orderQty,p))} each</span><b>Line total: ${centsMoney(line)}</b></div></div>${stepperHtml(pid,q,p.inventory)}</div>`;}).join('');renderOrderSummary();}
function currentQuote(){const q=cartQty(),subtotal=cartSubtotalCents(),z=$('zone')?data.zones.find(x=>x.id===$('zone').value):null,normalDelivery=z?zoneFeeCents(z):0;let delivery=normalDelivery,deliveryReason='';if(z&&z.free_at_qty!=null&&q>=Number(z.free_at_qty)){delivery=0;deliveryReason=`${Number(z.free_at_qty)}+ Can Delivery Reward`;}const deliverySavings=Math.max(0,normalDelivery-delivery),pre=subtotal+delivery,step=Math.max(1,Number(data.settings?.round_down_to_cents)||500),total=Math.floor(pre/step)*step,discount=Math.max(0,pre-total);return {q,subtotal,normalDelivery,delivery,deliverySavings,deliveryReason,pre,total,discount,z};}
function renderOrderSummary(){const box=$('orderSummary');if(!box)return;const x=currentQuote(),label=data.settings?.customer_discount_label||'Customer Appreciation';box.innerHTML=`<div class="summary-line"><span>Products (${x.q} can${x.q===1?'':'s'})</span><b>${centsMoney(x.subtotal)}</b></div>${x.z?`<div class="summary-line"><span>${esc(x.z.name)} Delivery</span><b>${centsMoney(x.normalDelivery)}</b></div>${x.deliverySavings>0?`<div class="summary-line"><span>${esc(x.deliveryReason||'Delivery discount')}</span><b>−${centsMoney(x.deliverySavings)}</b></div><div class="summary-line"><span>Delivery</span><b>${x.delivery===0?'FREE':centsMoney(x.delivery)}</b></div>`:''}`:`<div class="summary-line"><span>Delivery</span><b>Select an address</b></div>`}${x.discount>0?`<div class="summary-line"><span>${esc(label)}</span><b>−${centsMoney(x.discount)}</b></div>`:''}<div class="summary-line total"><span>TOTAL</span><span>${x.z?centsMoney(x.total):'—'}</span></div>${x.deliverySavings>0?`<div class="summary-saving">You saved ${centsMoney(x.deliverySavings)} on delivery.</div>`:''}`;}
function closeCart(){$('sheet').classList.remove('open');}
async function submitOrder(){
  const entries=Object.entries(cart).filter(([,q])=>q>0),items=entries.map(([product_id,qty])=>({product_id,qty}));if(!items.length)return alert('Please choose at least one product.');
  const customer_name=$('customerName').value.trim(),customer_phone=$('customerPhone').value.trim(),customer_email=$('customerEmail').value.trim(),manual_location=$('manualLocation').checked,address=manual_location?'':$('customerAddress').value.trim(),meeting_instructions=$('meetingInstructions').value.trim(),delivery_notes=$('deliveryNotes').value.trim(),payment_method=$('paymentMethod')?.value||'',payment_note=$('paymentNote').value.trim(),zone_id=$('zone').value,outside=$('outsideHours').checked,date=$('deliveryDate').value,windowParts=($('deliveryWindow').value||'').split('|'),outside_hours_message=$('outsideMessage').value.trim();
  const qNow=cartQty(),minimum=currentSlug==='victoria'&&storefrontLane==='main'?5:1;if(qNow<minimum)return alert(`Minimum order here is ${minimum} cans.`);if(currentSlug==='victoria'&&storefrontLane==='small'&&qNow>4)return alert('Small Orders is for 1–4 cans. Move this cart to the Main Shop.');if(!customer_name||!customer_phone||(!manual_location&&!address))return alert('Please add your name, phone and delivery address.');if(manual_location&&!meeting_instructions)return alert('Tell us where to meet you.');if(!validateEmailField())return $('customerEmail').focus();if(!manual_location&&!zone_id)return alert('Select a suggested address so delivery can be confirmed.');if(outside&&!outside_hours_message)return alert('Tell us when you need delivery outside normal hours.');if(!outside&&windowParts.length<3)return alert('Choose a delivery date and 45-minute time window.');if(!$('ageAck').checked)return alert('Please confirm the age and ID requirement.');if(!payment_method)return alert('No payment method is currently available.');if(manual_location&&!confirm(`No exact address entered. We'll use your directions below and may call or text you to confirm the meeting spot.\n\nPLACE ORDER ANYWAY?`))return;
  const orderQty=cartQty(),snapshot=entries.map(([pid,qty])=>{const p=productById(pid);return {qty,brand:p?.brand||'',flavor:p?.flavor||'',strength:p?.strength||'',line_total_cents:unitPriceCents(orderQty,p)*qty}}),zone=data.zones.find(z=>z.id===zone_id);
  const b={territory_slug:currentSlug,storefront_lane:storefrontLane,items,zone_id,customer_name,customer_phone,customer_email,address,manual_location,meeting_instructions,delivery_notes,payment_method,payment_note,age_acknowledged:true,schedule_type:outside?'outside_hours':'window',requested_delivery_date:date,requested_window_start:outside?null:windowParts[0],requested_window_end:outside?null:windowParts[1],outside_hours_message};const btn=$('submitBtn');btn.disabled=true;btn.textContent='PLACING ORDER…';
  try{const r=await fetch('/api/public/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});const j=await r.json();if(!r.ok){btn.disabled=false;btn.textContent='PLACE ORDER';if(String(j.error||'').toLowerCase().includes('available'))await load();return alert(j.error||'Could not submit order');}
    const label=data.settings?.customer_discount_label||'Customer Appreciation',itemHtml=snapshot.map(x=>`<div class="receipt-line"><span>${x.qty} × ${esc(x.brand)} ${esc(x.flavor)}${x.strength?' • '+esc(displayStrength(x.strength)):''}</span><b>${centsMoney(x.line_total_cents)}</b></div>`).join('');cart={};updateCart();await load();
    const emailMessage=!customer_email?'':j.confirmation_email_status==='sent'?`<br><br>Confirmation emailed to ${esc(customer_email)}.`:`<br><br>Your order is confirmed. Email delivery is currently unavailable, so please save the live order link below.`;
    const timing=j.schedule_type==='outside_hours'?`<div class="notice"><b>SPECIAL DELIVERY REQUEST RECEIVED</b><br>We'll contact you as soon as possible to arrange your delivery time.<br><br>${esc(j.outside_hours_message)}</div>`:`<div class="notice"><b>REQUESTED DELIVERY</b><br>${esc(humanDate(j.requested_delivery_date))} • ${esc(j.requested_window_label)}</div>`,locationFlag=j.manual_location?`<div class="notice"><b>LOCATION NEEDS CONFIRMATION</b><br>${esc(j.meeting_instructions)}</div>`:'';
    $('checkout').innerHTML=`<div class="success"><div class="confirm-check">✓</div><div class="confirm-title">ORDER CONFIRMED</div><div class="small">Order #${j.order_no}</div>${timing}${locationFlag}<div class="receipt">${itemHtml}<div class="hr"></div><div class="receipt-line"><span>Products</span><b>${centsMoney(j.subtotal_cents)}</b></div><div class="receipt-line"><span>Delivery</span><b>${j.final_total_pending?'To be confirmed':(Number(j.delivery_fee_cents)===0?'FREE':centsMoney(j.delivery_fee_cents))}</b></div>${!j.final_total_pending&&j.delivery_savings_cents>0?`<div class="receipt-line"><span>${esc(j.delivery_discount_reason||'Delivery discount')}</span><b>−${centsMoney(j.delivery_savings_cents)}</b></div>`:''}${!j.final_total_pending&&j.customer_discount_cents>0?`<div class="receipt-line"><span>${esc(label)}</span><b>−${centsMoney(j.customer_discount_cents)}</b></div>`:''}<div class="receipt-line total"><span>FINAL TOTAL</span><span>${j.final_total_pending?`We'll confirm this with you`:centsMoney(j.total_cents)}</span></div></div><div class="order-meta"><b>Deliver to</b><br>${esc(address||meeting_instructions)}${delivery_notes?`<br><br><b>Delivery Notes</b><br>${esc(delivery_notes)}`:''}<br><br><b>Payment</b><br>${esc(paymentLabel(payment_method))}${emailMessage}</div>${j.status_url?`<p><a class="btn" style="display:block;text-decoration:none" href="${esc(j.status_url)}">VIEW MY ORDER</a></p>`:''}<button class="btn ghost" style="margin-top:8px" onclick="closeCart()">DONE</button></div>`;
  }catch(e){btn.disabled=false;btn.textContent='PLACE ORDER';alert('Could not submit order. Please try again.');}
}
async function renderOrderPage(token){
  try{
    const r=await fetch('/api/public/orders/token/'+encodeURIComponent(token),{cache:'no-store'}),o=await r.json();
    if(!r.ok)throw Error(o.error||'Order not found');
    const label='Customer Appreciation',pending=!!o.final_total_pending;
    const timing=o.requested_delivery_date?`${esc(o.requested_delivery_date)}${o.requested_window_label?` • ${esc(o.requested_window_label)}`:''}`:'Delivery time to be arranged';
    document.body.innerHTML=`<div class="order-page"><div class="card"><div class="small">POUCHES VIC</div><h1 style="margin:6px 0">Order #${o.order_no}</h1><span class="status-chip">${esc(String(o.status||'').replaceAll('_',' ').toUpperCase())}</span>${pending?'<span class="status-chip" style="margin-left:6px">FINAL TOTAL PENDING</span>':''}</div><div class="card"><div class="order-meta"><b>${esc(o.customer_name)}</b><br>${esc(o.address||o.meeting_instructions||'Location to be confirmed')}<br><br><b>Requested delivery</b><br>${timing}</div>${o.schedule_type==='outside_hours'?`<div class="notice"><b>Outside-hours request</b><br>${esc(o.outside_hours_message||'We will contact you to arrange delivery.')}</div>`:''}${o.manual_location?`<div class="notice"><b>Location needs confirmation</b><br>${esc(o.meeting_instructions||'We will contact you to confirm a meeting location and delivery fee.')}</div>`:''}${o.delivery_notes?`<div class="order-meta"><b>Delivery notes</b><br>${esc(o.delivery_notes)}</div>`:''}<div class="receipt">${o.items.map(i=>`<div class="receipt-line"><span>${i.qty} × ${esc(i.brand_snapshot)} ${esc(i.product_name_snapshot)}${i.strength_snapshot?' • '+esc(displayStrength(i.strength_snapshot)):''}</span><b>${centsMoney(i.line_total_cents)}</b></div>`).join('')}<div class="hr"></div><div class="receipt-line"><span>Products</span><b>${centsMoney(o.subtotal_cents)}</b></div><div class="receipt-line"><span>${esc(o.zone_name_snapshot||'Delivery')} Delivery</span><b>${pending?'To be confirmed':centsMoney(o.normal_delivery_fee_cents??o.delivery_fee_cents)}</b></div>${!pending&&o.delivery_savings_cents>0?`<div class="receipt-line"><span>${esc(o.delivery_discount_reason||'Delivery discount')}</span><b>−${centsMoney(o.delivery_savings_cents)}</b></div><div class="receipt-line"><span>Delivery</span><b>${Number(o.delivery_fee_cents)===0?'FREE':centsMoney(o.delivery_fee_cents)}</b></div>`:''}${o.customer_discount_cents>0?`<div class="receipt-line"><span>${label}</span><b>−${centsMoney(o.customer_discount_cents)}</b></div>`:''}<div class="receipt-line total"><span>TOTAL</span><span>${pending?'PENDING':centsMoney(o.total_cents)}</span></div>${!pending&&o.delivery_savings_cents>0?`<div style="padding-top:10px;color:#146b2f;font-weight:900">You saved ${centsMoney(o.delivery_savings_cents)} on delivery.</div>`:''}</div>${pending?'<div class="notice"><b>Your final total is not set yet.</b><br>We will confirm the delivery area and fee before completing this order.</div>':''}<div class="order-meta"><b>Payment</b><br>${esc(paymentLabel(o.payment_method))}</div>${o.driver_name?`<p><b>Driver:</b> ${esc(o.driver_name)}</p>`:''}${o.text_driver_href?`<a class="btn" style="display:block;text-decoration:none;text-align:center" href="${esc(o.text_driver_href)}">TEXT YOUR DRIVER</a>`:''}</div><a class="btn ghost" style="display:block;text-decoration:none;text-align:center" href="/">BACK TO POUCHES VIC</a></div>`;
  }catch(e){document.body.innerHTML=`<div class="order-page"><div class="card"><h2>Order not found</h2><p>We couldn't load that order.</p><a class="btn" href="/">BACK TO POUCHES VIC</a></div></div>`;}
}
init().catch(()=>{$('products').innerHTML='<div class="empty">Could not load inventory. Please refresh.</div>';});
</script>
