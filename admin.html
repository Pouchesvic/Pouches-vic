<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Pouches Vic Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#efefec;font-family:Arial,Helvetica,sans-serif;color:#111}.wrap{max-width:760px;margin:auto;padding:14px}.card{background:#fff;border-radius:18px;padding:15px;margin-bottom:12px}.title{font-size:27px;font-weight:1000}.muted{color:#4f4f4f;font-size:13px;line-height:1.4}.btn{border:0;border-radius:10px;background:#111;color:#fff;padding:11px 13px;font-weight:900}.ghost{background:#e9e9e9;color:#111}.danger{background:#842020}.head,.row{display:flex;justify-content:space-between;gap:9px;align-items:center}.tabs{display:flex;gap:7px;flex-wrap:wrap;padding:3px 0 11px}.tab{white-space:nowrap;border:0;border-radius:10px;padding:10px 12px;font-weight:900;flex:1 1 calc(33.333% - 7px);min-width:92px}.tab.active{background:#111;color:#fff}.field{margin:9px 0}.field label{display:block;font-size:12px;font-weight:900;margin-bottom:4px;color:#333}.field input,.field select,.field textarea{width:100%;border:1px solid #c8c8c8;border-radius:9px;padding:11px;font-size:16px;background:#fff;color:#111}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}.chip{display:inline-block;background:#eee;border-radius:999px;padding:6px 8px;font-size:12px;font-weight:800;margin:3px 3px 0 0}.on{background:#dcefdc}.off{background:#f1dddd}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.actions .btn{font-size:12px;padding:9px}.login{margin-top:22vh}.hidden{display:none}.order{border-left:5px solid #111}.money{font-size:18px;font-weight:1000}.rule{font-size:13px;line-height:1.45}.hr{height:1px;background:#ddd;margin:12px 0}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:50;align-items:flex-end}.modal.open{display:flex}.modalbox{background:#fff;width:100%;max-height:90vh;overflow:auto;border-radius:20px 20px 0 0;padding:17px}.close{float:right;border:0;border-radius:8px;padding:7px 9px}.warn{background:#fff7d9;border-radius:10px;padding:11px;font-size:13px;line-height:1.4}.good{background:#e7f5e7;border-radius:10px;padding:11px;font-size:13px;line-height:1.4}.cityrow{display:flex;gap:8px;align-items:end}.cityrow .field{flex:1}.manageCities{width:100%;margin:0 0 12px}.primary{background:#e7f5e7}.removeCity{margin-top:10px;width:100%}.stockNow{font-size:30px;font-weight:1000;line-height:1}.stockLabel{font-size:11px;font-weight:900;color:#4f4f4f;margin-bottom:4px}.statusline{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.receiveBox{background:#f6f6f4;border-radius:12px;padding:11px;margin-top:10px}.advanced summary{cursor:pointer;font-weight:900;font-size:13px;padding:8px 0}.lowStockCard{border:2px solid #e5c15b}.lowStockNote{background:#fff7d9;color:#5d4b10;border-radius:999px;padding:6px 8px;font-size:11px;font-weight:900;display:inline-block}
.hoursCard{background:#111;color:#fff;border-radius:16px;padding:14px 15px;margin:0 0 12px}
.hoursCard .eyebrow{font-size:10px;font-weight:900;letter-spacing:.1em;opacity:.65}
.hoursCard .currentHours{font-size:18px;font-weight:1000;margin:4px 0 9px}
.hoursCard .btn{background:#fff;color:#111;width:100%}.receipt{background:#f6f6f4;border-radius:12px;padding:12px;margin:12px 0}.receipt .line{display:flex;justify-content:space-between;gap:12px;padding:5px 0}.receipt .total{font-size:19px;font-weight:1000;border-top:1px solid #ddd;margin-top:5px;padding-top:10px}.archiveBox{margin-top:14px}.archiveItem{background:#f4f4f2;border-radius:12px;padding:12px;margin-top:8px}@media(max-width:460px){.two,.three{grid-template-columns:1fr 1fr}.tab{flex-basis:calc(50% - 7px)}.cityrow{align-items:stretch;flex-direction:column}.cityrow .field{margin-bottom:0}}
</style>
</head><body><div class="wrap">
<div id="login" class="card login"><div class="title">Pouches Vic Admin</div><p class="muted">Operations control room</p><div class="field"><input id="password" type="password" placeholder="Admin password"></div><button class="btn" style="width:100%" onclick="doLogin()">SIGN IN</button><div id="loginmsg" class="muted"></div></div>
<div id="app" class="hidden">
  <div class="head"><div><div class="title">Control Room</div><div id="terrName" class="muted"></div></div><button class="btn ghost" onclick="logout()">Log out</button></div>
  <div class="cityrow"><div class="field"><label>CITY / AREA</label><select id="terrSelect" onchange="selectTerritory(this.value)"></select></div><button class="btn ghost" onclick="openCities()">MANAGE CITIES</button></div>
  <div class="hoursCard"><div class="eyebrow">STORE • <span id="hoursCity"></span></div><div id="hoursCurrent" class="currentHours">Not set yet</div><button class="btn" onclick="openStorefrontInfo()">EDIT STOREFRONT</button></div>
  <div class="tabs"><button class="tab active" onclick="tab('orders',this)">Orders</button><button class="tab" onclick="tab('stock',this)">Stock</button><button class="tab" onclick="tab('drivers',this)">Drivers</button><button class="tab" id="moreTab" onclick="tab('more',this)">More</button></div>
  <div id="view"></div>
</div></div>
<div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="modalbox"><button class="close" onclick="closeModal()">✕</button><div id="modalContent"></div></div></div>
<script>
let bootstrap=null,T=null,currentTab='orders';const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),money=n=>new Intl.NumberFormat('en-CA',{style:'currency',currency:'CAD'}).format(Number(n)||0);
function displayStrength(value){const s=String(value??'').trim();if(!s)return '';if(/mg\s*$/i.test(s))return s.replace(/\s*mg\s*$/i,' mg');return /^\d+(?:\.\d+)?$/.test(s)?s+' mg':s}
async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}});let j={};try{j=await r.json()}catch{}if(r.status===401){showLogin();throw Error('unauthorized')}if(!r.ok)throw Error(j.error||'Request failed');return j}
function showLogin(){login.classList.remove('hidden');app.classList.add('hidden')}
async function doLogin(){try{await api('/api/admin/login',{method:'POST',body:JSON.stringify({password:password.value})});start()}catch(e){loginmsg.textContent=e.message==='unauthorized'?'Wrong password.':e.message}}
async function logout(){await api('/api/admin/logout',{method:'POST'});location.reload()}
function fillCities(){terrSelect.innerHTML=bootstrap.territories.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}
async function start(){bootstrap=await api('/api/admin/bootstrap');login.classList.add('hidden');app.classList.remove('hidden');fillCities();const vic=bootstrap.territories.find(x=>x.slug==='victoria')||bootstrap.territories[0];if(vic)await selectTerritory(vic.id)}
async function selectTerritory(id){terrSelect.value=id;T=await api('/api/admin/territories/'+id);terrName.textContent=T.territory.name;hoursCity.textContent=T.territory.name;hoursCurrent.textContent=T.territory.operating_hours||'Not set yet';render()}
function tab(name,btn){currentTab=name;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));btn.classList.add('active');render()}
function openCities(){currentTab='territories';render()}
function openStorefrontInfo(){
  $('modalContent').innerHTML=`<h2>${esc(T.territory.name)} Storefront</h2>
  <div class="good">These settings are separate for each city / area.</div>
  <div class="field"><label>HOURS OF OPERATION</label><input id="sfHours" value="${esc(T.territory.operating_hours||'')}" placeholder="Example: Mon–Sun • 10 AM–10 PM"></div>
  <div class="field"><label>DELIVERY LINE</label><input id="sfSameDay" value="${esc(T.territory.same_day_text||'SAME-DAY DELIVERY')}"></div>
  <div class="field"><label>PAYMENT LINE</label><input id="sfPayment" value="${esc(T.territory.payment_note_text||'No upfront payment — pay when your order arrives.')}"></div>
  <button class="btn" style="width:100%" onclick="saveStorefrontInfo()">SAVE & UPDATE WEBSITE</button>`;
  $('modal').classList.add('open');
}
async function saveStorefrontInfo(){
  const hours=$('sfHours').value.trim();
  const sameDay=$('sfSameDay').value.trim();
  const payment=$('sfPayment').value.trim();
  if(!hours)return alert('Enter the hours you want customers to see.');
  await api(`/api/admin/territories/${T.territory.id}/storefront-info`,{method:'PUT',body:JSON.stringify({
    operating_hours:hours,
    same_day_text:sameDay,
    payment_note_text:payment
  })});
  closeModal();
  await selectTerritory(T.territory.id);
}
function render(){({orders:renderOrders,stock:()=>window.renderCompanyInventory?window.renderCompanyInventory():renderProducts(),products:()=>window.renderProductLibrary?window.renderProductLibrary():renderProducts(),inventory:()=>window.renderCompanyInventory?window.renderCompanyInventory():renderProducts(),zones:renderZones,drivers:renderDrivers,pricing:renderPricing,settlements:renderSettlements,territories:renderTerritories,more:renderMore}[currentTab]||renderOrders)()}
function morePage(name){currentTab=name;render()}
function renderMore(){view.innerHTML=`<div class="card"><h2 style="margin-top:0">More</h2><div class="two"><button class="btn ghost" onclick="morePage('pricing')">PRICING</button><button class="btn ghost" onclick="morePage('settlements')">SETTLEMENTS</button><button class="btn ghost" onclick="morePage('territories')">CITIES / AREAS</button><button class="btn ghost" onclick="window.pvOpenCustomers?.()">CUSTOMERS</button><button class="btn ghost" onclick="morePage('products')">ARCHIVED PRODUCTS</button></div><button class="btn" style="width:100%;margin-top:9px" onclick="openStorefrontInfo()">EDIT STOREFRONT</button></div><div class="card"><h3>ORDER NOTIFICATIONS</h3><div class="muted">Enable new-order browser alerts on this Admin device.</div><div class="actions"><button class="btn" onclick="enableAdminPush()">ENABLE ORDER NOTIFICATIONS</button><button class="btn ghost" onclick="testAdminPush()">TEST ALERT</button><button class="btn ghost" onclick="disableAdminPush()">TURN OFF NOTIFICATIONS</button></div></div>`}
function vapidBytes(s){const p='='.repeat((4-s.length%4)%4),raw=atob((s+p).replace(/-/g,'+').replace(/_/g,'/')),out=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)out[i]=raw.charCodeAt(i);return out}
async function adminSW(){if(!('serviceWorker'in navigator))throw Error('This browser does not support notifications.');await navigator.serviceWorker.register('/sw.js',{scope:'/'});return navigator.serviceWorker.ready}
async function enableAdminPush(){try{if(await Notification.requestPermission()!=='granted')throw Error('Notification permission was not allowed.');const config=await api('/api/admin/push-config'),reg=await adminSW();let sub=await reg.pushManager.getSubscription();if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:vapidBytes(config.public_key)});await api('/api/admin/push-subscribe',{method:'POST',body:JSON.stringify({subscription:sub.toJSON()})});alert('Admin order notifications are connected on this device.')}catch(e){alert(e.message)}}
async function testAdminPush(){try{const r=await api('/api/admin/push-test',{method:'POST',body:'{}'});alert(r.sent?'Test alert sent.':'No Admin notification subscription is connected.')}catch(e){alert(e.message)}}
async function disableAdminPush(){try{const reg=await adminSW(),sub=await reg.pushManager.getSubscription();if(sub){await api('/api/admin/push-unsubscribe',{method:'POST',body:JSON.stringify({endpoint:sub.endpoint})});await sub.unsubscribe()}alert('Admin order notifications are off on this device.')}catch(e){alert(e.message)}}
function orderLocalToday(o){const parts=Object.fromEntries(new Intl.DateTimeFormat('en-CA',{timeZone:o.territory_timezone_snapshot||T.territory.timezone||'America/Vancouver',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()).filter(x=>x.type!=='literal').map(x=>[x.type,x.value]));return `${parts.year}-${parts.month}-${parts.day}`}
function humanOrderDate(value){return value?new Intl.DateTimeFormat('en-CA',{weekday:'long',month:'long',day:'numeric',timeZone:'UTC'}).format(new Date(value+'T12:00:00Z')):''}
function orderFlags(o){const future=o.requested_delivery_date&&o.requested_delivery_date>orderLocalToday(o),timing=o.requested_delivery_date?`<div><b>${future?esc(humanOrderDate(o.requested_delivery_date)):''}</b>${o.requested_window_label?`${future?' • ':''}${esc(o.requested_window_label)}`:''}</div>`:'';return `${future?'<span class="chip on">FUTURE DELIVERY</span>':''}${o.schedule_type==='outside_hours'?'<span class="chip off">OUTSIDE-HOURS REQUEST</span>':''}${o.manual_location?'<span class="chip off">LOCATION NEEDS CONFIRMATION</span>':''}${o.final_total_pending?'<span class="chip off">FINAL TOTAL PENDING</span>':''}${timing}`}
function orderCards(rows){return rows.map(o=>{const place=o.address||o.meeting_instructions||'Location to confirm',map=o.address?`https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(o.address)}`:'';return `<div class="card order" onclick="openOrder('${o.id}')"><div style="font-size:21px;font-weight:1000">${esc(o.customer_name||'Customer')}</div><a href="tel:${esc(o.customer_phone||'')}" onclick="event.stopPropagation()" style="font-size:17px;color:#111">${esc(o.customer_phone||'')}</a>${map?`<a href="${map}" target="_blank" rel="noopener" onclick="event.stopPropagation()" style="display:block;font-size:16px;margin-top:5px;color:#111">${esc(place)}</a>`:`<div style="font-size:16px;margin-top:5px">${esc(place)}</div>`}<div class="statusline">${orderFlags(o)}</div><div class="row"><div class="muted">Order #${o.order_no} • ${esc(o.status)}${o.driver_name?' • '+esc(o.driver_name):''}</div><div class="money">${o.final_total_pending?'PENDING':money(o.total)}</div></div></div>`}).join('')}
function renderOrders(){const attention=T.orders.filter(o=>o.schedule_type==='outside_hours'||o.manual_location||o.final_total_pending).length,today=T.orders.filter(o=>!o.requested_delivery_date||o.requested_delivery_date<=orderLocalToday(o)),upcoming=T.orders.filter(o=>o.requested_delivery_date>orderLocalToday(o));view.innerHTML=`${attention?`<div class="warn"><b>NEEDS ATTENTION</b> • ${attention}</div>`:''}<div class="card"><b>Quick Actions</b><div class="actions"><button class="btn" onclick="currentTab='stock';render()">ADD STOCK</button><button class="btn ghost" onclick="currentTab='stock';render()">MOVE STOCK</button><button class="btn ghost" onclick="openOffsiteSale()">OFF-SITE SALE</button><button class="btn ghost" onclick="openFreeCans()">FREE CANS</button></div></div><h2>TODAY</h2>${today.length?orderCards(today):'<div class="card muted">No orders for today.</div>'}<h2>UPCOMING</h2>${upcoming.length?orderCards(upcoming):'<div class="card muted">No upcoming orders.</div>'}`}
function freeProductOptions(){return T.products.filter(p=>!p.archived&&Number(p.inventory)>0).map(p=>`<option value="${p.id}">${esc(p.brand)} ${esc(p.flavor)} • ${p.inventory} available</option>`).join('')}
let adminFreeCatalog=[];
async function openFreeCans(){const stock=await api(`/api/admin/company-stock/catalog?territory_id=${encodeURIComponent(T.territory.id)}`);adminFreeCatalog=stock.catalog||[];$('modalContent').innerHTML=`<h2>Free Cans</h2><div class="field"><label>WHERE ARE THE CANS NOW?</label><select id="freeSource" onchange="refreshFreeProducts()"><option value="territory">${esc(T.territory.name)}</option><option value="company">Company</option></select></div><div class="field"><label>WHO ARE THEY FOR?</label><select id="freeRecipient"><option value="self">Myself</option>${T.drivers.filter(d=>d.active&&!d.archived).map(d=>`<option value="${d.id}">${esc(d.name)}</option>`).join('')}<option value="customer">Customer</option></select></div><div class="field"><label>PRODUCT</label><select id="freeProduct"></select></div><div class="field"><label>QUANTITY</label><input id="freeQty" type="number" min="1" value="1"></div><div class="field"><label>NOTE <span class="muted">(optional)</span></label><input id="freeNote"></div><button class="btn" style="width:100%" onclick="saveFreeCans()">GIVE FREE CANS</button>`;$('modal').classList.add('open');refreshFreeProducts()}
function refreshFreeProducts(){const company=freeSource.value==='company';freeProduct.innerHTML=adminFreeCatalog.map(p=>{const available=company?Number(p.company?.reserve)||0:Number(p.selected_territory?.customer_sellable)||0;return available>0?`<option value="${p.id}">${esc(p.brand)} ${esc(p.flavor)} • ${available} available</option>`:''}).join('')}
async function saveFreeCans(){const recipient=freeRecipient.value,qty=Math.max(0,Math.trunc(+freeQty.value||0));if(!freeProduct.value||!qty)return alert('Choose a product and quantity.');await api('/api/admin/operations/free-cans',{method:'POST',body:JSON.stringify({territory_id:T.territory.id,product_id:freeProduct.value,qty,source:freeSource.value,recipient_type:recipient==='customer'?'customer':recipient==='self'?'self':'driver',recipient_driver_id:!['self','customer'].includes(recipient)?recipient:null,note:freeNote.value})});alert('Free cans recorded. No settlement charge was created.');closeModal();await selectTerritory(T.territory.id)}
function openOffsiteSale(){$('modalContent').innerHTML=`<h2>Off-Site Sale</h2><div class="field"><label>PRODUCT</label><select id="saleProduct">${freeProductOptions()}</select></div><div class="two"><div class="field"><label>QUANTITY</label><input id="saleQty" type="number" min="1" value="1"></div><div class="field"><label>SALE AMOUNT</label><input id="saleAmount" type="number" min="0" step=".01"></div></div><div class="two"><div class="field"><label>PAYMENT METHOD</label><select id="saleMethod"><option value="cash">Cash</option><option value="etransfer">e-Transfer</option></select></div><div class="field"><label>WHO RECEIVED IT?</label><select id="saleDestination"><option value="driver">Driver</option><option value="company">Company</option></select></div></div><div class="field"><label>NOTE <span class="muted">(optional)</span></label><input id="saleNote"></div><button class="btn" style="width:100%" onclick="saveOffsiteSale()">RECORD SALE</button>`;$('modal').classList.add('open')}
async function saveOffsiteSale(){const qty=Math.max(0,Math.trunc(+saleQty.value||0)),defaultUnit=qty>=20?1250:qty>=10?1500:qty>=5?2000:2500,amount=saleAmount.value===''?qty*defaultUnit:Math.round(Number(saleAmount.value)*100);if(!saleProduct.value||!qty||amount<0)return alert('Choose a product, quantity and sale amount.');await api('/api/admin/quick-sale',{method:'POST',body:JSON.stringify({territory_id:T.territory.id,items:[{product_id:saleProduct.value,qty}],sale_amount_cents:amount,payment_amount_cents:amount,payment_method:saleMethod.value,payment_destination:saleDestination.value,customer_name:'Off-site customer',customer_phone:'Not supplied',address:'Off-site sale',status:'completed',note:saleNote.value})});alert('Off-site sale recorded.');closeModal();await selectTerritory(T.territory.id)}
async function openOrder(id){
  const o=await api('/api/admin/orders/'+id);
  const discount=(Number(o.customer_discount_cents)||0)/100;
  const normalDelivery=(Number(o.normal_delivery_fee_cents)||Number(o.zone_fee_snapshot_cents)||Number(o.delivery_fee_cents)||0)/100,deliverySavings=(Number(o.delivery_savings_cents)||0)/100;
  const label=bootstrap?.settings?.customer_discount_label||'Customer Appreciation';
  const emailStatus=o.customer_email?`${esc(o.customer_email)} • ${esc(o.confirmation_email_status||'not sent')}`:'No email supplied';
  const scheduled=o.requested_delivery_date?`${esc(humanOrderDate(o.requested_delivery_date))}${o.requested_window_label?` • ${esc(o.requested_window_label)}`:''}`:'Not scheduled';
  const substitutions=(o.substitutions||[]).map(s=>`<div class="warn" style="margin-top:8px"><b>SUBSTITUTION</b><br>${s.missing_qty} × ${esc(s.original_brand)} ${esc(s.original_flavor)} unavailable → ${(s.replacements||[]).map(r=>`${r.qty} × ${esc(r.brand)} ${esc(r.flavor)}`).join(', ')}${s.note?`<br><span class="muted">${esc(s.note)}</span>`:''}</div>`).join('');
  $('modalContent').innerHTML=`<h2>Order #${o.order_no}</h2>
    <div style="font-size:24px;font-weight:1000">${esc(o.customer_name)}</div><a href="tel:${esc(o.customer_phone||'')}" style="font-size:18px;color:#111">${esc(o.customer_phone||'')}</a>${o.customer_email?`<div class="muted">${esc(o.customer_email)}</div>`:''}${o.address?`<a href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(o.address)}" target="_blank" rel="noopener" style="display:block;margin-top:6px;color:#111">${esc(o.address)}</a>`:`<div style="margin-top:6px">${esc(o.meeting_instructions||'Location to confirm')}</div>`}
    <div class="statusline">${orderFlags(o)}<span class="chip">${scheduled}</span></div>
    ${o.schedule_type==='outside_hours'?`<div class="warn"><b>OUTSIDE-HOURS REQUEST</b><br>${esc(o.outside_hours_message||'Contact the customer to arrange delivery.')}</div>`:''}
    ${o.manual_location?`<div class="warn"><b>LOCATION NEEDS CONFIRMATION</b><br>${esc(o.meeting_instructions||'Contact the customer to confirm a meeting location and delivery fee.')}</div>`:''}
    ${o.delivery_notes?`<div class="warn" style="margin-top:10px"><b>DELIVERY NOTES</b><br>${esc(o.delivery_notes)}</div>`:''}
    <div class="statusline"><span class="chip">AREA: ${esc(o.zone_name_snapshot||'Not set')}</span><span class="chip">EMAIL: ${emailStatus}</span></div>
    ${substitutions}<div class="hr"></div>
    ${o.items.map(i=>`<div class="row"><span>${i.qty} × ${esc(i.brand_snapshot)} ${esc(i.product_name_snapshot)}${i.strength_snapshot?' • '+esc(displayStrength(i.strength_snapshot)):''}</span><b>${money(i.line_total)}</b></div>`).join('')}
    <div class="receipt">
      <div class="line"><span>Products</span><b>${money(o.subtotal)}</b></div>
      <div class="line"><span>${esc(o.zone_name_snapshot||'Delivery')} Delivery</span><b>${o.final_total_pending?'To be confirmed':money(normalDelivery)}</b></div>
      ${deliverySavings>0?`<div class="line"><span>${esc(o.delivery_discount_reason||o.zone_override_note||'Delivery discount')}</span><b>−${money(deliverySavings)}</b></div><div class="line"><span>Final delivery</span><b>${Number(o.delivery_fee_cents)===0?'FREE':money(o.delivery_fee)}</b></div>`:''}
      ${discount>0?`<div class="line"><span>${esc(label)}</span><b>−${money(discount)}</b></div>`:''}
      <div class="line total"><span>TOTAL</span><span>${o.final_total_pending?'PENDING':money(o.total)}</span></div>
    </div>
    <div class="two"><div class="field"><label>STATUS</label><select id="oStatus">${['new','assigned','acknowledged','picked_up','on_the_way','completed','cancelled'].map(status=>`<option value="${status}" ${o.status===status?'selected':''}>${status.replaceAll('_',' ')}</option>`).join('')}</select></div><div class="field"><label>DRIVER</label><select id="oDriver"><option value="">Unassigned</option>${T.drivers.filter(d=>d.active).map(d=>`<option value="${d.id}" ${d.id===o.assigned_driver_id?'selected':''}>${esc(d.name)}</option>`).join('')}</select></div></div>
    <div class="two"><div class="field"><label>DELIVERY FEE — EDIT/REMOVE ANY TIME</label><input id="oFee" type="number" step=".01" value="${o.delivery_fee}"></div><div class="field"><label>PAYMENT</label><select id="oPay"><option value="cash" ${['cash','Cash on delivery'].includes(o.payment_method)?'selected':''}>Cash on delivery</option><option value="etransfer" ${['etransfer','E-transfer','e-Transfer'].includes(o.payment_method)?'selected':''}>e-Transfer on delivery</option><option value="other" ${o.payment_method==='other'||o.payment_method==='Other'?'selected':''}>Other</option></select></div></div>

async function addProduct(){

  try{const created=await api('/api/admin/products',{method:'POST',body:JSON.stringify({brand,flavor,strength,image})});await api(`/api/admin/territories/${T.territory.id}/product/${created.id}`,{method:'PUT',body:JSON.stringify({listed:live,featured:false,local_price_override:'',sort_order:0})});if(starting>0)await api('/api/admin/inventory/receive',{method:'POST',body:JSON.stringify({territory_id:T.territory.id,product_id:created.id,qty:starting})});await selectTerritory(T.territory.id);}finally{if($('addProductBtn')){$('addProductBtn').disabled=false;$('addProductBtn').textContent='ADD PRODUCT';}}

let deliveryMap=null,mapPoints=[],mapMarkers=[],mapZoneId='';
async function loadMapbox(){if(window.mapboxgl)return;await new Promise((resolve,reject)=>{const css=document.createElement('link');css.rel='stylesheet';css.href='https://api.mapbox.com/mapbox-gl-js/v3.5.1/mapbox-gl.css';document.head.appendChild(css);const script=document.createElement('script');script.src='https://api.mapbox.com/mapbox-gl-js/v3.5.1/mapbox-gl.js';script.onload=resolve;script.onerror=()=>reject(Error('The delivery map could not load.'));document.head.appendChild(script)})}
async function openDeliveryMap(){const token=bootstrap.settings?.mapbox_public_token;if(!token){$('modalContent').innerHTML=`<h2>Edit Delivery Map</h2><div class="warn"><b>MAP SETUP NEEDED</b><br>Add the Mapbox public token under Owner Setup before drawing delivery areas.</div><button class="btn ghost" onclick="window.pvOpenStoreCheckoutSettings?.()">OPEN OWNER SETUP</button>`;$('modal').classList.add('open');return}try{await loadMapbox();mapboxgl.accessToken=token;$('modalContent').innerHTML=`<h2>Edit Delivery Map</h2><div class="field"><label>DELIVERY AREA</label><select id="mapZone" onchange="loadMapZone(this.value)">${T.zones.map(z=>`<option value="${z.id}">${esc(z.name)}</option>`).join('')}</select></div><div class="two"><div class="field"><label>FIND A LOCATION</label><input id="mapSearch" placeholder="Search an address or landmark"></div><button class="btn ghost" style="align-self:end;margin-bottom:9px" onclick="findMapLocation()">FIND</button></div><div id="deliveryMap" style="height:430px;border-radius:14px;overflow:hidden"></div><div id="mapWarning" class="muted" style="margin:8px 0">Tap around the boundary. Drag points to adjust it.</div><div class="three"><button class="btn ghost" onclick="undoMapPoint()">UNDO LAST POINT</button><button class="btn ghost" onclick="startMapOver()">START OVER</button><button class="btn" onclick="saveMapArea()">SAVE AREA</button></div>`;$('modal').classList.add('open');deliveryMap=new mapboxgl.Map({container:'deliveryMap',style:'mapbox://styles/mapbox/streets-v12',center:[0,20],zoom:1});deliveryMap.on('load',()=>loadMapZone(mapZone.value));deliveryMap.on('click',e=>{mapPoints.push([e.lngLat.lng,e.lngLat.lat]);renderMapShape()})}catch(e){alert(e.message)}}
function polygonPoints(z){try{const g=JSON.parse(z.geojson||'null'),geom=g?.type==='Feature'?g.geometry:g,ring=geom?.type==='Polygon'?geom.coordinates?.[0]:geom?.type==='MultiPolygon'?geom.coordinates?.[0]?.[0]:[];return ring?.length>1?ring.slice(0,-1):[]}catch{return[]}}
function loadMapZone(id){mapZoneId=id;mapPoints=polygonPoints(T.zones.find(z=>z.id===id)||{});renderMapShape();if(mapPoints.length)deliveryMap.fitBounds(mapPoints.reduce((b,p)=>b.extend(p),new mapboxgl.LngLatBounds(mapPoints[0],mapPoints[0])),{padding:45})}
function renderMapShape(){mapMarkers.forEach(m=>m.remove());mapMarkers=[];mapPoints.forEach((point,index)=>{const marker=new mapboxgl.Marker({draggable:true,color:'#111'}).setLngLat(point).addTo(deliveryMap);marker.on('drag',()=>{const p=marker.getLngLat();mapPoints[index]=[p.lng,p.lat];drawMapFill()});mapMarkers.push(marker)});drawMapFill()}
function drawMapFill(){const ring=mapPoints.length>=3?[...mapPoints,mapPoints[0]]:[],data={type:'Feature',properties:{},geometry:{type:'Polygon',coordinates:[ring]}};if(deliveryMap.getSource('editing-area'))deliveryMap.getSource('editing-area').setData(data);else if(deliveryMap.isStyleLoaded()){deliveryMap.addSource('editing-area',{type:'geojson',data});deliveryMap.addLayer({id:'editing-area-fill',type:'fill',source:'editing-area',paint:{'fill-color':'#111','fill-opacity':.22}});deliveryMap.addLayer({id:'editing-area-line',type:'line',source:'editing-area',paint:{'line-color':'#111','line-width':3}})}}
function undoMapPoint(){mapPoints.pop();renderMapShape()}function startMapOver(){if(confirm('Start this area over?')){mapPoints=[];renderMapShape()}}
async function findMapLocation(){const query=mapSearch.value.trim();if(!query)return;try{const r=await fetch(`https://api.mapbox.com/geocoding/v5/mapbox.places/${encodeURIComponent(query)}.json?access_token=${encodeURIComponent(bootstrap.settings.mapbox_public_token)}&country=ca&limit=1`),j=await r.json();if(!j.features?.[0])throw Error('Location not found.');deliveryMap.flyTo({center:j.features[0].center,zoom:13})}catch(e){alert(e.message)}}
async function saveMapArea(){if(mapPoints.length<3)return alert('Tap at least three points around the area.');const z=T.zones.find(x=>x.id===mapZoneId),ring=[...mapPoints,mapPoints[0]],geojson=JSON.stringify({type:'Feature',properties:{},geometry:{type:'Polygon',coordinates:[ring]}});try{await api(`/api/admin/territories/${T.territory.id}/zone`,{method:'POST',body:JSON.stringify({id:z.id,name:z.name,color_label:z.color_label,fee:z.fee,free_at_qty:z.free_at_qty,rule_notes:z.rule_notes,geojson,active:z.active})});const check=await api(`/api/admin/territories/${T.territory.id}/map-check`);mapWarning.innerHTML=check.overlaps.length?`<b>${esc(check.overlaps.map(x=>`${x[0]} and ${x[1]} overlap here.`).join(' '))}</b>`:'Area saved.';await selectTerritory(T.territory.id)}catch(e){alert(e.message)}}

function renderPricing(){view.innerHTML=`<div class="good">Pricing is separate for each city / area. Change these fields any time.</div>`+T.tiers.map(t=>`<div class="card"><div class="three"><div class="field"><label>MIN QTY</label><input id="tmin_${t.id}" type="number" value="${t.min_qty}"></div><div class="field"><label>MAX QTY (BLANK = +)</label><input id="tmax_${t.id}" type="number" value="${t.max_qty??''}"></div><div class="field"><label>PRICE / CAN</label><input id="tprice_${t.id}" type="number" step=".01" value="${t.unit_price}"></div></div><label><input id="tactive_${t.id}" type="checkbox" ${t.active?'checked':''}> Active</label><button class="btn" style="width:100%;margin-top:8px" onclick="saveTier('${t.id}')">SAVE PRICE TIER</button></div>`).join('')}
async function saveTier(id){await api(`/api/admin/territories/${T.territory.id}/tier`,{method:'POST',body:JSON.stringify({id,min_qty:+document.getElementById('tmin_'+id).value||0,max_qty:document.getElementById('tmax_'+id).value,unit_price:+document.getElementById('tprice_'+id).value||0,active:document.getElementById('tactive_'+id).checked})});await selectTerritory(T.territory.id)}
async function renderSettlements(){const data=await api(`/api/admin/platform/territories/${T.territory.id}/settlements`),cash=c=>money((Number(c)||0)/100),when=v=>new Intl.DateTimeFormat('en-CA',{month:'long',day:'numeric'}).format(new Date(v));view.innerHTML=data.drivers.map(s=>{const companyOwes=s.final_direction==='company_owes_driver';return `<div class="card"><div style="font-size:20px;font-weight:1000">${esc(s.driver.name)}</div><div class="muted">Open Since ${when(s.started_at)}</div><div class="two" style="margin-top:10px"><div class="receiveBox"><span class="muted">Cans Accounted For</span><div class="stockNow">${s.accountable_items}</div></div><div class="receiveBox"><span class="muted">Company Received</span><div class="money">${cash(s.boss_credit_cents)}</div></div></div><div style="background:${companyOwes?'#28623d':'#111'};color:#fff;border-radius:16px;padding:17px;margin:10px 0;text-align:center"><div style="font-size:12px;font-weight:900">${companyOwes?'COMPANY OWES DRIVER':'SEND TO COMPANY'}</div><div style="font-size:38px;font-weight:1000">${cash(s.final_amount_cents)}</div></div>${s.adjustment_cents?`<div class="warn">Calculated: ${cash(Math.abs(s.calculated_net_cents))}<br>Company Adjustment: ${s.adjustment_cents<0?'−':'+'}${cash(Math.abs(s.adjustment_cents))}<br>${esc(s.adjustment_reason)}</div>`:''}<details class="advanced"><summary>View Breakdown</summary><div class="receipt"><div class="line"><span>Website Sales</span><b>${s.sold_website}</b></div><div class="line"><span>Off-Site Sales</span><b>${s.sold_off_website}</b></div><div class="line"><span>Personal-Use Charge</span><b>${cash(s.personal_use_charge_cents)}</b></div><div class="line"><span>Company Share</span><b>${cash(s.boss_share_before_credits_cents)}</b></div><div class="line"><span>Company Received</span><b>−${cash(s.boss_credit_cents)}</b></div><div class="line"><span>Delivery Fees</span><b>${cash(s.delivery_fees_cents)}</b></div><div class="line"><span>Tips</span><b>${cash(s.tips_cents)}</b></div></div></details><div class="three"><button class="btn ghost" onclick="window.pvAdjustSettlement?.('${s.period.id}','${s.final_direction}',${s.final_amount_cents})">ADJUST FINAL</button><button class="btn ghost" onclick="window.pvShareSettlement?.('${s.period.id}')">COPY / SHARE</button><button class="btn" onclick="window.pvCloseSettlement?.('${s.period.id}')">MARK AS SETTLED</button></div></div>`}).join('')+`<details class="card"><summary><b>Previous Settlements (${data.history.length})</b></summary>${data.history.map(h=>`<div class="archiveItem"><b>${esc(h.driver_name)}</b><div class="muted">${when(h.started_at)} – ${when(h.closed_at)} · Settled</div></div>`).join('')||'<div class="muted">No previous settlements.</div>'}</details>`}
function slugify(s){return String(s||'').trim().toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')}
function renderTerritories(){view.innerHTML=`<div class="good">Add a city or service area once. It gets its own inventory, pricing, zones, drivers and orders.</div><div class="card"><b>Add City / Area</b><div class="field"><label>CITY / AREA NAME</label><input id="newTName" placeholder="Edmonton"></div><div class="field"><label>DOMAIN (OPTIONAL)</label><input id="newTDomain" placeholder="pouchesedmonton.com"></div><button class="btn" style="width:100%" onclick="addTerritory()">ADD CITY / AREA</button></div>`+bootstrap.territories.map(t=>`<div class="card ${t.slug==='victoria'?'primary':''}"><div class="row"><div><b>${esc(t.name)}</b><div class="muted">${t.domain?esc(t.domain):'No separate domain'}</div></div>${t.slug==='victoria'?'<span class="chip on">PRIMARY CITY</span>':''}</div>${t.slug!=='victoria'?`<button class="btn danger removeCity" onclick="removeTerritory('${t.id}')">REMOVE CITY</button>`:''}</div>`).join('')}
async function addTerritory(){const name=newTName.value.trim();const slug=slugify(name);if(!name||!slug)return alert('Enter a city / area name.');await api('/api/admin/territories',{method:'POST',body:JSON.stringify({name,slug,domain:newTDomain.value.trim(),active:true})});bootstrap=await api('/api/admin/bootstrap');fillCities();const added=bootstrap.territories.find(x=>x.slug===slug)||bootstrap.territories.find(x=>x.slug==='victoria')||bootstrap.territories[0];if(added)await selectTerritory(added.id);renderTerritories()}
async function removeTerritory(id){const city=bootstrap.territories.find(x=>x.id===id);const name=city?.name||'this city';if(!confirm(`Remove ${name} from the active cities? Existing records will be kept archived.`))return;await api('/api/admin/territories/'+id,{method:'DELETE'});bootstrap=await api('/api/admin/bootstrap');fillCities();const vic=bootstrap.territories.find(x=>x.slug==='victoria')||bootstrap.territories[0];if(vic)await selectTerritory(vic.id);openCities()}
function closeModal(){$('modal').classList.remove('open')}
start().catch(()=>showLogin());
</script></body></html>
