<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Pouches Vic Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#efefec;font-family:Arial,Helvetica,sans-serif;color:#111}.wrap{max-width:760px;margin:auto;padding:14px}.card{background:#fff;border-radius:18px;padding:15px;margin-bottom:12px}.title{font-size:27px;font-weight:1000}.muted{color:#4f4f4f;font-size:13px;line-height:1.4}.btn{border:0;border-radius:10px;background:#111;color:#fff;padding:11px 13px;font-weight:900}.ghost{background:#e9e9e9;color:#111}.danger{background:#842020}.head,.row{display:flex;justify-content:space-between;gap:9px;align-items:center}.tabs{display:flex;gap:7px;flex-wrap:wrap;padding:3px 0 11px}.tab{white-space:nowrap;border:0;border-radius:10px;padding:10px 12px;font-weight:900;flex:1 1 calc(33.333% - 7px);min-width:92px}.tab.active{background:#111;color:#fff}.field{margin:9px 0}.field label{display:block;font-size:12px;font-weight:900;margin-bottom:4px;color:#333}.field input,.field select,.field textarea{width:100%;border:1px solid #c8c8c8;border-radius:9px;padding:11px;font-size:16px;background:#fff;color:#111}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}.chip{display:inline-block;background:#eee;border-radius:999px;padding:6px 8px;font-size:12px;font-weight:800;margin:3px 3px 0 0}.on{background:#dcefdc}.off{background:#f1dddd}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.actions .btn{font-size:12px;padding:9px}.login{margin-top:22vh}.hidden{display:none}.order{border-left:5px solid #111}.money{font-size:18px;font-weight:1000}.rule{font-size:13px;line-height:1.45}.hr{height:1px;background:#ddd;margin:12px 0}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:50;align-items:flex-end}.modal.open{display:flex}.modalbox{background:#fff;width:100%;max-height:90vh;overflow:auto;border-radius:20px 20px 0 0;padding:17px}.close{float:right;border:0;border-radius:8px;padding:7px 9px}.warn{background:#fff7d9;border-radius:10px;padding:11px;font-size:13px;line-height:1.4}.good{background:#e7f5e7;border-radius:10px;padding:11px;font-size:13px;line-height:1.4}.cityrow{display:flex;gap:8px;align-items:end}.cityrow .field{flex:1}.manageCities{width:100%;margin:0 0 12px}.primary{background:#e7f5e7}.removeCity{margin-top:10px;width:100%}.stockNow{font-size:30px;font-weight:1000;line-height:1}.stockLabel{font-size:11px;font-weight:900;color:#4f4f4f;margin-bottom:4px}.statusline{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.receiveBox{background:#f6f6f4;border-radius:12px;padding:11px;margin-top:10px}.advanced summary{cursor:pointer;font-weight:900;font-size:13px;padding:8px 0}.lowStockCard{border:2px solid #e5c15b}.lowStockNote{background:#fff7d9;color:#5d4b10;border-radius:999px;padding:6px 8px;font-size:11px;font-weight:900;display:inline-block}
.hoursCard{background:#111;color:#fff;border-radius:16px;padding:14px 15px;margin:0 0 12px}
.hoursCard .eyebrow{font-size:10px;font-weight:900;letter-spacing:.1em;opacity:.65}
.hoursCard .currentHours{font-size:18px;font-weight:1000;margin:4px 0 9px}
.hoursCard .btn{background:#fff;color:#111;width:100%}.receipt{background:#f6f6f4;border-radius:12px;padding:12px;margin:12px 0}.receipt .line{display:flex;justify-content:space-between;gap:12px;padding:5px 0}.receipt .total{font-size:19px;font-weight:1000;border-top:1px solid #ddd;margin-top:5px;padding-top:10px}.archiveBox{margin-top:14px}.archiveItem{background:#f4f4f2;border-radius:12px;padding:12px;margin-top:8px}@media(max-width:460px){.two,.three{grid-template-columns:1fr 1fr}.tab{flex-basis:calc(50% - 7px)}.cityrow{align-items:stretch;flex-direction:column}.cityrow .field{margin-bottom:0}}
</style>
</head><body><div class="wrap">
<div id="login" class="card login"><div class="title">Pouches Vic Admin</div><p class="muted">Operations control room</p><div class="field"><input id="password" type="password" placeholder="Admin password"></div><button class="btn" style="width:100%" onclick="doLogin()">SIGN IN</button><div id="loginmsg" class="muted"></div></div>
<div id="app" class="hidden">
  <div class="head"><div><div class="title">Control Room</div><div id="terrName" class="muted"></div></div><button class="btn ghost" onclick="logout()">Log out</button></div>
  <div class="cityrow"><div class="field"><label>CITY / AREA</label><select id="terrSelect" onchange="selectTerritory(this.value)"></select></div><button class="btn ghost" onclick="openCities()">MANAGE CITIES</button></div>
  <div class="hoursCard"><div class="eyebrow">STORE HOURS • <span id="hoursCity"></span></div><div id="hoursCurrent" class="currentHours">Not set yet</div><button class="btn" onclick="openStorefrontInfo()">EDIT HOURS & STOREFRONT INFO</button></div>
  <div class="tabs"><button class="tab active" onclick="tab('orders',this)">Orders</button><button class="tab" onclick="tab('products',this)">Products</button><button class="tab" onclick="tab('inventory',this)">Inventory</button><button class="tab" onclick="tab('zones',this)">Zones</button><button class="tab" onclick="tab('drivers',this)">Drivers</button><button class="tab" onclick="tab('pricing',this)">Pricing</button><button class="tab" onclick="tab('settlements',this)">Settlements</button><button class="tab" id="citiesTab" onclick="tab('territories',this)">Cities</button></div>
  <div id="view"></div>
</div></div>
<div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="modalbox"><button class="close" onclick="closeModal()">✕</button><div id="modalContent"></div></div></div>
<script>
let bootstrap=null,T=null,currentTab='orders';const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),money=n=>new Intl.NumberFormat('en-CA',{style:'currency',currency:'CAD'}).format(Number(n)||0);
function displayStrength(value){const s=String(value??'').trim();if(!s)return '';if(/mg\s*$/i.test(s))return s.replace(/\s*mg\s*$/i,' mg');return /^\d+(?:\.\d+)?$/.test(s)?s+' mg':s}
async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}});let j={};try{j=await r.json()}catch{}if(r.status===401){showLogin();throw Error('unauthorized')}if(!r.ok)throw Error(j.error||'Request failed');return j}
function showLogin(){login.classList.remove('hidden');app.classList.add('hidden')}
async function doLogin(){try{await api('/api/admin/login',{method:'POST',body:JSON.stringify({password:password.value})});start()}catch(e){loginmsg.textContent=e.message==='unauthorized'?'Wrong password.':e.message}}
async function logout(){await api('/api/admin/logout',{method:'POST'});location.reload()}
function fillCities(){terrSelect.innerHTML=bootstrap.territories.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}
async function start(){bootstrap=await api('/api/admin/bootstrap');login.classList.add('hidden');app.classList.remove('hidden');fillCities();const vic=bootstrap.territories.find(x=>x.slug==='victoria')||bootstrap.territories[0];if(vic)await selectTerritory(vic.id)}
async function selectTerritory(id){terrSelect.value=id;T=await api('/api/admin/territories/'+id);terrName.textContent=T.territory.name;hoursCity.textContent=T.territory.name;hoursCurrent.textContent=T.territory.operating_hours||'Not set yet';render()}
function tab(name,btn){currentTab=name;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));btn.classList.add('active');render()}
function openCities(){tab('territories',$('citiesTab'))}
function openStorefrontInfo(){
  $('modalContent').innerHTML=`<h2>${esc(T.territory.name)} Storefront</h2>
  <div class="good">These settings are separate for each city / area.</div>
  <div class="field"><label>HOURS OF OPERATION</label><input id="sfHours" value="${esc(T.territory.operating_hours||'')}" placeholder="Example: Mon–Sun • 10 AM–10 PM"></div>
  <div class="field"><label>DELIVERY LINE</label><input id="sfSameDay" value="${esc(T.territory.same_day_text||'SAME-DAY DELIVERY')}"></div>
  <div class="field"><label>PAYMENT LINE</label><input id="sfPayment" value="${esc(T.territory.payment_note_text||'No upfront payment — pay when your order arrives.')}"></div>
  <button class="btn" style="width:100%" onclick="saveStorefrontInfo()">SAVE & UPDATE WEBSITE</button>`;
  $('modal').classList.add('open');
}
async function saveStorefrontInfo(){
  const hours=$('sfHours').value.trim();
  const sameDay=$('sfSameDay').value.trim();
  const payment=$('sfPayment').value.trim();
  if(!hours)return alert('Enter the hours you want customers to see.');
  await api(`/api/admin/territories/${T.territory.id}/storefront-info`,{method:'PUT',body:JSON.stringify({
    operating_hours:hours,
    same_day_text:sameDay,
    payment_note_text:payment
  })});
  closeModal();
  await selectTerritory(T.territory.id);
}
function render(){({orders:renderOrders,products:()=>window.renderProductLibrary?window.renderProductLibrary():renderProducts(),inventory:()=>window.renderCompanyInventory?window.renderCompanyInventory():renderProducts(),zones:renderZones,drivers:renderDrivers,pricing:renderPricing,settlements:renderSettlements,territories:renderTerritories}[currentTab]||renderOrders)()}
function renderOrders(){view.innerHTML=`<div class="good">New website orders are automatically dispatched to this city's default driver. You can still reassign an individual order when needed.</div>`+(T.orders.length?T.orders.map(o=>`<div class="card order" onclick="openOrder('${o.id}')"><div class="row"><div><b>#${o.order_no} • ${esc(o.customer_name||'Customer')}</b><div class="muted">${new Date(o.created_at).toLocaleString()} • ${esc(o.status)}</div></div><div class="money">${money(o.total)}</div></div><div class="muted" style="margin-top:7px">${esc(o.address)}${o.driver_name?' • '+esc(o.driver_name):''}</div></div>`).join(''):`<div class="card">No orders yet.</div>`)}
async function openOrder(id){
  const o=await api('/api/admin/orders/'+id);
  const discount=(Number(o.customer_discount_cents)||0)/100;
  const normalDelivery=(Number(o.normal_delivery_fee_cents)||Number(o.zone_fee_snapshot_cents)||Number(o.delivery_fee_cents)||0)/100,deliverySavings=(Number(o.delivery_savings_cents)||0)/100;
  const label=bootstrap?.settings?.customer_discount_label||'Customer Appreciation';
  const emailStatus=o.customer_email?`${esc(o.customer_email)} • ${esc(o.confirmation_email_status||'not sent')}`:'No email supplied';
  $('modalContent').innerHTML=`<h2>Order #${o.order_no}</h2>
    <div class="muted"><b>${esc(o.customer_name)}</b> • ${esc(o.customer_phone)}${o.customer_email?`<br>${esc(o.customer_email)}`:''}<br>${esc(o.address)}</div>
    ${o.delivery_notes?`<div class="warn" style="margin-top:10px"><b>DELIVERY NOTES</b><br>${esc(o.delivery_notes)}</div>`:''}
    <div class="statusline"><span class="chip">AREA: ${esc(o.zone_name_snapshot||'Not set')}</span><span class="chip">EMAIL: ${emailStatus}</span></div>
    <div class="hr"></div>
    ${o.items.map(i=>`<div class="row"><span>${i.qty} × ${esc(i.brand_snapshot)} ${esc(i.product_name_snapshot)}${i.strength_snapshot?' • '+esc(displayStrength(i.strength_snapshot)):''}</span><b>${money(i.line_total)}</b></div>`).join('')}
    <div class="receipt">
      <div class="line"><span>Products</span><b>${money(o.subtotal)}</b></div>
      <div class="line"><span>${esc(o.zone_name_snapshot||'Delivery')} Delivery</span><b>${money(normalDelivery)}</b></div>
      ${deliverySavings>0?`<div class="line"><span>${esc(o.delivery_discount_reason||o.zone_override_note||'Delivery discount')}</span><b>−${money(deliverySavings)}</b></div><div class="line"><span>Final delivery</span><b>${Number(o.delivery_fee_cents)===0?'FREE':money(o.delivery_fee)}</b></div>`:''}
      ${discount>0?`<div class="line"><span>${esc(label)}</span><b>−${money(discount)}</b></div>`:''}
      <div class="line total"><span>TOTAL</span><span>${money(o.total)}</span></div>
    </div>
    <div class="two"><div class="field"><label>STATUS</label><select id="oStatus">${['new','assigned','acknowledged','picked_up','on_the_way','completed','cancelled'].map(status=>`<option value="${status}" ${o.status===status?'selected':''}>${status.replaceAll('_',' ')}</option>`).join('')}</select></div><div class="field"><label>DRIVER</label><select id="oDriver"><option value="">Unassigned</option>${T.drivers.filter(d=>d.active).map(d=>`<option value="${d.id}" ${d.id===o.assigned_driver_id?'selected':''}>${esc(d.name)}</option>`).join('')}</select></div></div>
    <div class="two"><div class="field"><label>DELIVERY FEE — EDIT/REMOVE ANY TIME</label><input id="oFee" type="number" step=".01" value="${o.delivery_fee}"></div><div class="field"><label>PAYMENT</label><select id="oPay"><option value="cash" ${['cash','Cash on delivery'].includes(o.payment_method)?'selected':''}>Cash on delivery</option><option value="etransfer" ${['etransfer','E-transfer','e-Transfer'].includes(o.payment_method)?'selected':''}>e-Transfer on delivery</option><option value="other" ${o.payment_method==='other'||o.payment_method==='Other'?'selected':''}>Other</option></select></div></div>
    ${o.payment_note?`<div class="muted"><b>Payment note:</b> ${esc(o.payment_note)}</div>`:''}
    <div class="field"><label>FEE OVERRIDE NOTE</label><input id="oNote" value="${esc(o.zone_override_note||'')}" placeholder="Example: waived delivery fee"></div>
    <button class="btn" style="width:100%;margin-top:12px" onclick="saveOrder('${o.id}')">SAVE ORDER</button>
    <div class="hr"></div><h3>Inventory adjustment / swap / free can</h3><div class="warn">Use this when a driver swaps, returns, or gives a can at the door. This changes inventory without forcing you to rebuild the order.</div><div class="two"><div class="field"><label>PRODUCT</label><select id="adjProduct">${T.products.filter(p=>!p.archived).map(p=>`<option value="${p.id}">${esc(p.brand)} ${esc(p.flavor)}</option>`).join('')}</select></div><div class="field"><label>INVENTORY CHANGE</label><input id="adjQty" type="number" value="0" placeholder="-1 or +1"></div></div><div class="field"><label>NOTE</label><input id="adjNote" placeholder="Swap / return / free can"></div><button class="btn ghost" style="width:100%" onclick="adjust('${o.id}')">APPLY INVENTORY CHANGE</button>`;
  $('modal').classList.add('open');
}
async function saveOrder(id){await api('/api/admin/orders/'+id,{method:'PUT',body:JSON.stringify({status:oStatus.value,assigned_driver_id:oDriver.value||null,delivery_fee:+oFee.value||0,zone_override_note:oNote.value,payment_method:oPay.value})});closeModal();await selectTerritory(T.territory.id)}
async function adjust(id){const qty=Math.trunc(+adjQty.value||0),note=adjNote.value.trim();if(!qty)return alert('Enter an inventory change such as -1 or +1.');if(!note)return alert('Add a short note explaining the adjustment.');await api('/api/admin/orders/'+id+'/adjustment',{method:'POST',body:JSON.stringify({kind:'door_adjustment',amount:0,note,affects_inventory:true,product_id:adjProduct.value,qty_delta:qty})});alert('Inventory updated.');await selectTerritory(T.territory.id);openOrder(id)}
function productCard(p){return `<div class="card ${(Number(p.inventory)||0)<=19?'lowStockCard':''}" data-product-id="${p.id}">
    <div class="row"><div><b>${esc(p.brand)} • ${esc(p.flavor)}</b><div class="muted">${esc(displayStrength(p.strength))}</div></div><div style="text-align:right"><div class="stockLabel">CURRENT STOCK</div><div class="stockNow">${p.inventory??0}</div><div class="muted">cans</div></div></div>
    <div class="statusline"><span class="chip ${p.listed?'on':'off'}">${p.listed?'LIVE':'HIDDEN'}</span>${p.featured?'<span class="chip on">FEATURED</span>':''}${(Number(p.inventory)||0)<=19?`<span class="lowStockNote">LOW STOCK • ${Number(p.inventory)||0} LEFT</span>`:''}</div>
    <div class="receiveBox"><div class="field" style="margin-top:0"><label>RECEIVE STOCK — HOW MANY CANS ARRIVED?</label><input id="receive_${p.id}" type="number" min="1" inputmode="numeric" placeholder="Example: 400"></div><button class="btn" style="width:100%" onclick="receiveStock('${p.id}')">RECEIVE STOCK</button></div>
    <div class="actions"><button class="btn ${p.listed?'ghost':''}" onclick="saveProductSettings('${p.id}',${p.listed?0:1},${p.featured?1:0})">${p.listed?'HIDE FROM STORE':'LIST LIVE'}</button><button class="btn ghost" onclick="saveProductSettings('${p.id}',${p.listed?1:0},${p.featured?0:1})">${p.featured?'UNFEATURE':'FEATURE'}</button></div>
    <details class="advanced"><summary>Advanced product settings</summary>
      <div class="two"><div class="field"><label>LOCAL PRICE OVERRIDE</label><input id="price_${p.id}" type="number" step=".01" value="${p.local_price_override??''}" placeholder="Leave blank for normal price"></div><div class="field"><label>DISPLAY ORDER</label><input id="sort_${p.id}" type="number" value="${p.sort_order??0}" placeholder="0"></div></div>
      <button class="btn ghost" style="width:100%" onclick="saveProductSettings('${p.id}',${p.listed?1:0},${p.featured?1:0})">SAVE ADVANCED SETTINGS</button><div class="hr"></div>
      <div class="two"><div class="field"><label>STOCK CORRECTION (+ OR − CANS)</label><input id="adjust_${p.id}" type="number" value="0" inputmode="numeric" placeholder="-2 or +5"></div><div class="field"><label>REASON</label><input id="reason_${p.id}" placeholder="Damaged / count correction"></div></div>
      <button class="btn ghost" style="width:100%" onclick="adjustProductStock('${p.id}')">APPLY STOCK CORRECTION</button><div class="hr"></div>
      <div class="actions"><button class="btn ghost" onclick="archiveProduct('${p.id}','${esc(p.brand+' '+p.flavor)}')">ARCHIVE PRODUCT</button><button class="btn danger" onclick="permanentDeleteProduct('${p.id}','${esc(p.brand+' '+p.flavor)}')">DELETE PERMANENTLY</button></div>
    </details></div>`}
function renderProducts(){
  const active=T.products.filter(p=>!p.archived), archived=T.products.filter(p=>p.archived);
  view.innerHTML=`<div class="card"><b>Add Product</b><div class="two"><div class="field"><label>BRAND</label><input id="pBrand" placeholder="Pablo"></div><div class="field"><label>FLAVOUR</label><input id="pFlavor" placeholder="Frost"></div></div><div class="two"><div class="field"><label>STRENGTH (MG)</label><input id="pStrength" placeholder="30"></div><div class="field"><label>STARTING STOCK (CANS)</label><input id="pStock" type="number" min="0" value="0" inputmode="numeric"></div></div><div class="field"><label>IMAGE URL</label><input id="pImage" placeholder="Optional"></div><label style="display:flex;gap:8px;align-items:center;margin:10px 0"><input id="pLive" type="checkbox" style="width:20px;height:20px"> List live in ${esc(T.territory.name)} now</label><button id="addProductBtn" class="btn" style="width:100%" onclick="addProduct()">ADD PRODUCT</button></div><div class="good">Stock is counted in cans. New deliveries go into “Receive Stock” below. Customer orders reduce stock automatically.</div>`+active.map(productCard).join('')+
  `<details class="card archiveBox"><summary><b>Archived Products (${archived.length})</b></summary>${archived.length?archived.map(p=>`<div class="archiveItem"><div class="row"><div><b>${esc(p.brand)} • ${esc(p.flavor)}</b><div class="muted">${esc(displayStrength(p.strength))} • ${p.inventory??0} cans in ${esc(T.territory.name)}</div></div></div><div class="actions"><button class="btn" onclick="restoreProduct('${p.id}')">RESTORE PRODUCT</button><button class="btn danger" onclick="permanentDeleteProduct('${p.id}','${esc(p.brand+' '+p.flavor)}')">DELETE PERMANENTLY</button></div></div>`).join(''):'<div class="muted" style="margin-top:10px">No archived products.</div>'}</details>`;
}
async function addProduct(){
  const brand=$('pBrand').value.trim(),flavor=$('pFlavor').value.trim(),strength=$('pStrength').value.trim(),image=$('pImage').value.trim(),starting=Math.max(0,Math.trunc(+$('pStock').value||0)),live=$('pLive').checked,btn=$('addProductBtn');
  if(!brand||!flavor)return alert('Brand and flavour are required.');
  btn.disabled=true;btn.textContent='ADDING…';
  try{const created=await api('/api/admin/products',{method:'POST',body:JSON.stringify({brand,flavor,strength,image})});await api(`/api/admin/territories/${T.territory.id}/product/${created.id}`,{method:'PUT',body:JSON.stringify({listed:live,featured:false,local_price_override:'',sort_order:0})});if(starting>0)await api('/api/admin/inventory/receive',{method:'POST',body:JSON.stringify({territory_id:T.territory.id,product_id:created.id,qty:starting})});await selectTerritory(T.territory.id);}finally{if($('addProductBtn')){$('addProductBtn').disabled=false;$('addProductBtn').textContent='ADD PRODUCT';}}
}
async function receiveStock(pid){const el=$('receive_'+pid),qty=Math.max(0,Math.trunc(+el.value||0));if(!qty)return alert('Enter how many cans arrived.');await api('/api/admin/inventory/receive',{method:'POST',body:JSON.stringify({territory_id:T.territory.id,product_id:pid,qty})});await selectTerritory(T.territory.id)}
async function adjustProductStock(pid){const delta=Math.trunc(+$('adjust_'+pid).value||0),reason=$('reason_'+pid).value.trim();if(!delta)return alert('Enter a stock change such as -2 or +5.');if(!reason)return alert('Add a short reason for the stock correction.');await api('/api/admin/inventory/adjust',{method:'POST',body:JSON.stringify({territory_id:T.territory.id,product_id:pid,qty_delta:delta,reason})});await selectTerritory(T.territory.id)}
async function saveProductSettings(pid,listed,featured){await api(`/api/admin/territories/${T.territory.id}/product/${pid}`,{method:'PUT',body:JSON.stringify({listed:!!listed,featured:!!featured,local_price_override:$('price_'+pid)?.value||'',sort_order:+$('sort_'+pid)?.value||0})});await selectTerritory(T.territory.id)}
async function archiveProduct(pid,name){if(!confirm(`Archive ${name}? It will be hidden from every storefront but kept so you can restore it later.`))return;await api(`/api/admin/territories/${T.territory.id}/product/${pid}`,{method:'DELETE'});await selectTerritory(T.territory.id)}
async function restoreProduct(pid){await api(`/api/admin/products/${pid}/restore`,{method:'POST'});await selectTerritory(T.territory.id)}
async function permanentDeleteProduct(pid,name){if(!confirm(`PERMANENTLY delete ${name}? This cannot be undone.`))return;if(!confirm('Last check: delete this product profile and its stock history permanently?'))return;await api(`/api/admin/products/${pid}/permanent`,{method:'DELETE'});await selectTerritory(T.territory.id)}
function renderZones(){view.innerHTML=`<div class="good"><b>AUTOMATIC MAP ZONING</b><br>Paste verified Polygon or MultiPolygon GeoJSON for each delivery zone. Customer addresses are geocoded with Mapbox and checked against these saved boundaries. Delivery Exceptions still take priority.</div><div class="warn">Green receives free delivery at 10+ cans. Orange and Pink never receive that automatic reward. An empty polygon means automatic zoning cannot match that zone; do not guess coordinates from written boundary notes.</div><div class="card"><b>Add Zone</b>${zoneForm({active:1})}<button class="btn" style="width:100%" onclick="saveZone('')">ADD ZONE</button></div>`+T.zones.map(z=>`<div class="card"><div class="row"><b>${esc(z.name)}</b><span class="chip ${String(z.geojson||'').trim()?'on':'off'}">${String(z.geojson||'').trim()?'POLYGON CONFIGURED':'POLYGON NEEDED'}</span></div>${zoneForm(z,z.id)}<button class="btn" style="width:100%" onclick="saveZone('${z.id}')">SAVE ZONE</button></div>`).join('')}
function zoneForm(z,p='new'){return `<div class="two"><div class="field"><label>NAME</label><input id="zn_${p}" value="${esc(z.name||'')}"></div><div class="field"><label>COLOR LABEL</label><input id="zc_${p}" value="${esc(z.color_label||'')}"></div></div><div class="two"><div class="field"><label>NORMAL DELIVERY FEE</label><input id="zf_${p}" type="number" step=".01" value="${z.fee??0}"></div><div class="field"><label>AUTOMATIC REWARD</label><input value="Green only: FREE at 10+ cans" disabled></div></div><div class="field"><label>BOUNDARY / RULE NOTES</label><textarea id="zr_${p}">${esc(z.rule_notes||'')}</textarea></div><div class="field"><label>VERIFIED ZONE POLYGON GEOJSON</label><textarea id="zgeo_${p}" rows="9" spellcheck="false" placeholder='Paste a GeoJSON Feature, Polygon, or MultiPolygon with [longitude, latitude] coordinates'>${esc(z.geojson||'')}</textarea><div class="muted">Polygon rings must be closed (first and last coordinate identical). Leave empty until exact points are verified.</div></div><label><input id="za_${p}" type="checkbox" ${z.active?'checked':''}> Active</label>`}
async function saveZone(p){const idv=p||'new',name=document.getElementById('zn_'+idv).value.trim();try{await api(`/api/admin/territories/${T.territory.id}/zone`,{method:'POST',body:JSON.stringify({id:p||null,name,color_label:document.getElementById('zc_'+idv).value,fee:+document.getElementById('zf_'+idv).value||0,free_at_qty:name.toLowerCase()==='green'?10:'',rule_notes:document.getElementById('zr_'+idv).value,geojson:document.getElementById('zgeo_'+idv).value.trim(),active:document.getElementById('za_'+idv).checked})});await selectTerritory(T.territory.id)}catch(e){alert(e.message)}}
function renderDrivers(){
  const active=T.drivers.filter(d=>d.active&&!d.archived);
  view.innerHTML=`<div class="card" style="border:2px solid #111">
    <b>AUTO-DISPATCH NEW ORDERS</b>
    <div class="muted" style="margin-top:5px">New website orders go straight to this driver. No Company approval or assignment is needed.</div>
    <div class="field"><label>DEFAULT DISPATCH DRIVER — ${esc(T.territory.name)}</label><select id="dispatchDriver"><option value="">Choose driver</option>${active.map(d=>`<option value="${d.id}" ${T.territory.default_driver_id===d.id?'selected':''}>${esc(d.name)}</option>`).join('')}</select></div>
    <label style="display:flex;gap:8px;align-items:center;margin:10px 0"><input id="dispatchEnabled" type="checkbox" style="width:20px;height:20px" ${T.territory.auto_dispatch_enabled?'checked':''}> Automatically dispatch new website orders</label>
    <button class="btn" style="width:100%" onclick="saveDispatchSettings()">SAVE AUTO-DISPATCH</button>
    <a class="btn ghost" style="display:block;text-align:center;text-decoration:none;margin-top:8px" href="/driver" target="_blank">OPEN DRIVER APP</a>
  </div>
  <div class="good">Each city has its own default dispatch driver. Victoria defaults to Victoria Driver 1. You can reassign an individual order later if needed.</div>
  <div class="card"><b>Add Driver</b>${driverForm({active:1,role:'driver'})}<button class="btn" style="width:100%" onclick="saveDriver('')">ADD DRIVER</button></div>`+
  T.drivers.map(d=>`<div class="card"><div class="row"><b>${esc(d.name)}</b>${T.territory.default_driver_id===d.id?'<span class="chip on">AUTO-DISPATCH</span>':''}</div>${driverForm(d,d.id)}<button class="btn" style="width:100%" onclick="saveDriver('${d.id}')">SAVE DRIVER</button></div>`).join('')
}
function driverForm(d,p='new'){return `<div class="two"><div class="field"><label>NAME</label><input id="dn_${p}" value="${esc(d.name||'')}"></div><div class="field"><label>ROLE</label><select id="dr_${p}"><option value="driver" ${d.role==='driver'?'selected':''}>Driver</option><option value="operations_admin" ${d.role==='operations_admin'?'selected':''}>Operations Admin</option></select></div></div><div class="two"><div class="field"><label>PHONE</label><input id="dp_${p}" value="${esc(d.phone||'')}"></div><div class="field"><label>EMAIL</label><input id="de_${p}" value="${esc(d.email||'')}"></div></div><div class="field"><label>DRIVER APP PIN</label><input id="dpin_${p}" type="password" inputmode="numeric" placeholder="${p==='new'?'Set a PIN':'Leave blank to keep current PIN'}"></div><div class="field"><label>NOTES</label><input id="dnote_${p}" value="${esc(d.notes||'')}"></div><label><input id="da_${p}" type="checkbox" ${d.active?'checked':''}> Active</label>`}
async function saveDriver(p){const x=p||'new';await api(`/api/admin/territories/${T.territory.id}/driver`,{method:'POST',body:JSON.stringify({id:p||null,name:$('dn_'+x).value,role:$('dr_'+x).value,phone:$('dp_'+x).value,email:$('de_'+x).value,pin:$('dpin_'+x).value,notes:$('dnote_'+x).value,active:$('da_'+x).checked})});await selectTerritory(T.territory.id)}
async function saveDispatchSettings(){const driverId=$('dispatchDriver').value;if($('dispatchEnabled').checked&&!driverId)return alert('Choose the driver who should receive new orders.');await api(`/api/admin/territories/${T.territory.id}/dispatch-settings`,{method:'PUT',body:JSON.stringify({auto_dispatch_enabled:$('dispatchEnabled').checked,default_driver_id:driverId})});await selectTerritory(T.territory.id);alert('Auto-dispatch saved.')}
function renderPricing(){view.innerHTML=`<div class="good">Pricing is separate for each city / area. Change these fields any time.</div>`+T.tiers.map(t=>`<div class="card"><div class="three"><div class="field"><label>MIN QTY</label><input id="tmin_${t.id}" type="number" value="${t.min_qty}"></div><div class="field"><label>MAX QTY (BLANK = +)</label><input id="tmax_${t.id}" type="number" value="${t.max_qty??''}"></div><div class="field"><label>PRICE / CAN</label><input id="tprice_${t.id}" type="number" step=".01" value="${t.unit_price}"></div></div><label><input id="tactive_${t.id}" type="checkbox" ${t.active?'checked':''}> Active</label><button class="btn" style="width:100%;margin-top:8px" onclick="saveTier('${t.id}')">SAVE PRICE TIER</button></div>`).join('')}
async function saveTier(id){await api(`/api/admin/territories/${T.territory.id}/tier`,{method:'POST',body:JSON.stringify({id,min_qty:+document.getElementById('tmin_'+id).value||0,max_qty:document.getElementById('tmax_'+id).value,unit_price:+document.getElementById('tprice_'+id).value||0,active:document.getElementById('tactive_'+id).checked})});await selectTerritory(T.territory.id)}
async function renderSettlements(){const companyText=value=>String(value??'').replace(/\bboss\b/gi,'Company');const rep=await api(`/api/admin/territories/${T.territory.id}/settlements`);view.innerHTML=`<div class="good">Victoria's special Driver 1 / Driver 2 arrangement is preloaded. Every rule can be changed or turned off. Other cities start with no special hierarchy.</div><h3>Current Rules</h3>`+T.rules.map(r=>`<div class="card rule"><b>${esc(companyText(r.name))}</b><div>${esc(r.rule_type)} • ${money(r.amount)}</div><div class="muted">${esc(companyText(r.notes))}</div><span class="chip ${r.active?'on':'off'}">${r.active?'ACTIVE':'OFF'}</span></div>`).join('')+`<h3>Completed-order totals</h3>`+rep.rows.map(r=>`<div class="card"><b>${esc(r.driver)}</b><div class="two"><div><span class="muted">Cans</span><br><b>${r.cans}</b></div><div><span class="muted">Company owed</span><br><b>${money(r.boss_owed)}</b></div></div><div class="muted" style="margin-top:7px">Delivery fees handled: ${money(r.delivery_fees)}</div><div class="muted">Owes drivers: ${esc(JSON.stringify(r.owes))}</div><div class="muted">Receives: ${esc(JSON.stringify(r.receives))}</div></div>`).join('')+`<div class="warn">Victoria rules are stored as editable database records.</div>`}
function slugify(s){return String(s||'').trim().toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')}
function renderTerritories(){view.innerHTML=`<div class="good">Add a city or service area once. It gets its own inventory, pricing, zones, drivers and orders.</div><div class="card"><b>Add City / Area</b><div class="field"><label>CITY / AREA NAME</label><input id="newTName" placeholder="Edmonton"></div><div class="field"><label>DOMAIN (OPTIONAL)</label><input id="newTDomain" placeholder="pouchesedmonton.com"></div><button class="btn" style="width:100%" onclick="addTerritory()">ADD CITY / AREA</button></div>`+bootstrap.territories.map(t=>`<div class="card ${t.slug==='victoria'?'primary':''}"><div class="row"><div><b>${esc(t.name)}</b><div class="muted">${t.domain?esc(t.domain):'No separate domain'}</div></div>${t.slug==='victoria'?'<span class="chip on">PRIMARY CITY</span>':''}</div>${t.slug!=='victoria'?`<button class="btn danger removeCity" onclick="removeTerritory('${t.id}')">REMOVE CITY</button>`:''}</div>`).join('')}
async function addTerritory(){const name=newTName.value.trim();const slug=slugify(name);if(!name||!slug)return alert('Enter a city / area name.');await api('/api/admin/territories',{method:'POST',body:JSON.stringify({name,slug,domain:newTDomain.value.trim(),active:true})});bootstrap=await api('/api/admin/bootstrap');fillCities();const added=bootstrap.territories.find(x=>x.slug===slug)||bootstrap.territories.find(x=>x.slug==='victoria')||bootstrap.territories[0];if(added)await selectTerritory(added.id);renderTerritories()}
async function removeTerritory(id){const city=bootstrap.territories.find(x=>x.id===id);const name=city?.name||'this city';if(!confirm(`Remove ${name} from the active cities? Existing records will be kept archived.`))return;await api('/api/admin/territories/'+id,{method:'DELETE'});bootstrap=await api('/api/admin/bootstrap');fillCities();const vic=bootstrap.territories.find(x=>x.slug==='victoria')||bootstrap.territories[0];if(vic)await selectTerritory(vic.id);openCities()}
function closeModal(){$('modal').classList.remove('open')}
start().catch(()=>showLogin());
</script></body></html>
